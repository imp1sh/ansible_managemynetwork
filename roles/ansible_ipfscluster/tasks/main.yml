---
- name: "MMN ipfscluster - Validate inputs"
  ansible.builtin.include_tasks: checks.yml
  when: ipfscluster_instances | length > 0

- name: "MMN ipfscluster - Separate active and decommissioned instances"
  ansible.builtin.set_fact:
    _ipfscluster_active_instances: >-
      {{ ipfscluster_instances | rejectattr('state', 'defined') | list
         + ipfscluster_instances | selectattr('state', 'defined')
                                   | rejectattr('state', 'equalto', 'absent') | list }}
    _ipfscluster_absent_instances: >-
      {{ ipfscluster_instances | selectattr('state', 'defined')
                                 | selectattr('state', 'equalto', 'absent') | list }}

- name: "MMN ipfscluster - Phase 1: Initialise identities"
  ansible.builtin.include_tasks: 01init.yml
  loop: "{{ _ipfscluster_active_instances }}"
  loop_control:
    loop_var: ipfscluster_instance
  when: _ipfscluster_active_instances | length > 0

- name: "MMN ipfscluster - Phase 2: Collect peer IDs (active instances only)"
  ansible.builtin.include_tasks: 02collect_peers.yml
  when: _ipfscluster_active_instances | length > 0

- name: "MMN ipfscluster - Phase 3: Render service.json"
  ansible.builtin.include_tasks: 03render.yml
  loop: "{{ _ipfscluster_active_instances }}"
  loop_control:
    loop_var: ipfscluster_instance
  when: _ipfscluster_active_instances | length > 0

- name: "MMN ipfscluster - Phase 4: Decommission absent instances"
  ansible.builtin.include_tasks: 04decommission.yml
  loop: "{{ _ipfscluster_absent_instances }}"
  loop_control:
    loop_var: ipfscluster_instance
  when: _ipfscluster_absent_instances | length > 0

- name: "MMN ipfscluster - Skip status feedback"
  ansible.builtin.debug:
    msg: >-
      The role ansible_ipfscluster did not run on host {{ inventory_hostname }}
      because ipfscluster_instances is not set or empty.
  when: ipfscluster_instances | length == 0
