---
# ansible_gtk3 — manages GTK3 user configuration per-user.
# Deploys two files into ~/.config/gtk-3.0/:
#   1. settings.ini  — GtkSettings properties (theme, fonts, cursor, etc.)
#   2. bookmarks     — Sidebar shortcuts in file dialogs and Thunar
#
# Non-opinionated: all defaults are EMPTY. Set content via variables in
# group_vars/host_vars. Supports per-user overrides via gtk3_configs.
#
# settings.ini keys are GtkSettings GObject property names (verified via
# GtkSettings.list_properties()). Values are strings. Boolean properties
# accept "0" or "1". See README.md for the full property list.
#
# bookmarks entries are URIs (file://, sftp://, smb://, dav://, ...)
# with an optional label separated by a space.

# ---------------------------------------------------------------------------
# Target user(s). String or list. Null → uses ansible_user.
# ---------------------------------------------------------------------------
gtk3_users: null

# ---------------------------------------------------------------------------
# Base settings.ini — dict of GtkSettings property → string value.
# Applied to ALL users unless overridden in gtk3_configs.
# Empty by default; populate in group_vars/host_vars.
# ---------------------------------------------------------------------------
gtk3_settings: {}
# Example:
# gtk3_settings:
#   gtk-theme-name: "Adwaita"
#   gtk-icon-theme-name: "Adwaita"
#   gtk-font-name: "Noto Sans 10"
#   gtk-application-prefer-dark-theme: "1"
#   gtk-xft-antialias: "1"
#   gtk-xft-hinting: "0"
#   gtk-xft-hintstyle: "hintnone"
#   gtk-xft-rgba: "rgb"

# ---------------------------------------------------------------------------
# Base bookmarks — list of URIs with optional labels.
# Applied to ALL users unless overridden in gtk3_configs.
# Entries can be strings (just the URI) or dicts with 'uri' and 'label'.
# Empty by default; populate in group_vars/host_vars.
# ---------------------------------------------------------------------------
gtk3_bookmarks: []
# Example:
# gtk3_bookmarks:
#   - uri: "file:///home/jochen/Downloads"
#     label: "Downloads"
#   - uri: "file:///home/jochen/Bilder"
#   - "sftp://user@host/path Remote Share"

# ---------------------------------------------------------------------------
# Per-user overrides — keyed by username.
# Each entry can contain 'settings' (shallow-merged over gtk3_settings)
# and/or 'bookmarks' (REPLACES the base gtk3_bookmarks list entirely).
# Users not listed here get the base config verbatim.
# ---------------------------------------------------------------------------
gtk3_configs: {}
# Example:
# gtk3_configs:
#   jochen:
#     settings:
#       gtk-theme-name: "Adwaita-dark"
#     bookmarks:
#       - uri: "file:///home/jochen/Downloads"
#         label: "Downloads"
#       - uri: "file:///home/jochen/git"
#   alice:
#     settings:
#       gtk-application-prefer-dark-theme: "0"
#     bookmarks:
#       - uri: "file:///home/alice/Documents"
