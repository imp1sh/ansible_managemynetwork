---
# ansible_intercom_indoor — MQTT/State + Mikro-Sender (Opus/RTP)
intercom_broker_host: "mqtt0.t.libcom.de"
intercom_broker_port: 8883
intercom_ca_file: "/etc/ssl/certs/ca-certificates.crt"
intercom_mqtt_username: "intercomd-intercombasement"
intercom_mqtt_password: ""
intercom_state_http_port: 8099
intercom_ring_timeout: 30
intercom_led_gpio: null
intercom_audio_tx_host: "fd01:4dd0:28d4::6923"
intercom_audio_tx_port: 5004

# --- Boot-Konfiguration (config.txt): Overlay fuer INMP441 ---
# Gleiche Verdrahtung wie an der Tuerstation (GPIO18/19/20, L/R an GND,
# siehe WIRING.md). Das Overlay erstellt die ALSA-Karte sndrpigooglevoi;
# Aenderungen wirken erst nach einem Reboot (Handler).
intercom_config_txt_path: "/boot/firmware/config.txt"
intercom_config_txt_block: |
  # Intercom indoor: INMP441 I2S-Mikrofon (GPIO18/19/20, siehe WIRING.md)
  dtoverlay=googlevoicehat-soundcard

# --- Mikrofon-Quelle (INMP441) ---
# Der Uplink liest aecsrc (echo-bereinigtes Mikrofon) aus der PipeWire-
# Session; die Rohkarte (sndrpigooglevoi) bleibt Diagnose-Ziel.
intercom_mic_alsa_device: "aecsrc"

# --- Uplink-Pegel (Digital-Gain vor Opus-Encoding) ---
# INMP441-Sprache liegt roh bei ca. -55 dBFS; +12 dB (4.0x linear) bringt
# die Sprache auf einen gesunden Pegel am Tuer-Lautsprecher. Auf 1.0
# setzen, um zunaechst unveraerstert zu messen.
intercom_audio_tx_volume: "4.0"

# --- PipeWire-Session fuer AEC (Spiegel der Tuerstation) ---
# Verhindert das Selbst-Hoeren: die App-Wiedergabe (Downlink) laeuft ueber
# den aec.sink (dient dem Echo-Canceller als Referenz), der Uplink liest
# aecsrc (gefiltertes Mikrofon). Die Session des Users intercom laeuft mit
# Linger; die UID wird dynamisch ermittelt (getent), da sie sich vom
# Tuer-Geraet unterscheiden kann (dort zufaellig 999, hier belegt dnsmasq 999).
intercom_pipewire_user: "intercom"
intercom_pipewire_user_home: "/var/lib/intercom"
intercom_pipewire_mic_node: "alsa_input.platform-soc_sound.stereo-fallback"
intercom_pipewire_speaker_node: "alsa_output.usb-Jieli_Technology_USB_Composite_Device_B58D8A9978704453-01.analog-stereo"
# Speex statt WebRTC: lineare Echokompensation, laesst die Gegenseite beim
# gleichzeitigen Sprechen durch (Messreihe an der Tuerstation, 2026-11-10).
intercom_pipewire_aec_method: "speex"
# Lautsprecher-Sink-Pegel (wpctl-Skala): 1.0 = 100%. Wird nach jedem
# Session-Start erzwungen (analog zur Tuerstation, wo ein alter State von
# 0.4 den Uplink um -24 dB daempfte).
intercom_speaker_volume: "1.0"

# --- Mikrofon-Empfindlichkeit (WebGUI/API, wie Tuerstation) ---
# Node-Volume der soc_sound-Quelle in der PipeWire-Session (wpctl-Skala,
# kubisch: linear = v^3). 1.0 = 0 dB (Unity); das Innen-Mikro steht nah
# am Sprecher, daher weniger Boost noetig als an der Tuer. Aenderungen
# ueber die WebGUI landen in intercom_mic_volume_file und ueberleben
# Reboots (set-speaker-volume.service setzt den Wert beim Start).
intercom_mic_volume: "1.0"
intercom_mic_volume_file: "/var/lib/intercom/mic_volume"
intercom_mic_volume_max: "4.0"
