---
# ansible_intercom_indoor — MQTT-Subscriber + lokaler State-/LED-Daemon
intercom_broker_host: "mqtt0.t.libcom.de"
intercom_broker_port: 8883
intercom_ca_file: "/etc/ssl/certs/ca-certificates.crt"
intercom_mqtt_username: "intercomd-intercombasement"
intercom_mqtt_password: ""      # vaulted in host_vars (erforderlich)
intercom_state_http_port: 8099
intercom_ring_timeout: 30       # Sekunden bis RING automatisch auf idle faellt
intercom_led_gpio: null          # z. B. 23, sobald verdrahtet
