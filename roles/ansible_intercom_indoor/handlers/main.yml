---
- name: Restart intercomd
  ansible.builtin.systemd:
    name: intercomd.service
    state: restarted
    daemon_reload: true

- name: Restart intercom audio sender if running
  ansible.builtin.systemd:
    name: intercom-audio-tx.service
    state: restarted
    daemon_reload: true
  when: "ansible_facts.get('services', {}).get('intercom-audio-tx.service', {}).get('state', '') == 'running'"

- name: Reboot intercom indoor for config.txt
  # Das I2S-Overlay (googlevoicehat-soundcard) laedt nur beim Boot; die Karte
  # sndrpigooglevoi existiert erst danach. Alle Dienste (intercom-app,
  # intercomd, intercom-audio-tx) sind systemd-aktiviert und kommen nach dem
  # Reboot selbst wieder hoch.
  ansible.builtin.reboot:
    reboot_timeout: 300
