---
- name: Restart intercomd
  ansible.builtin.systemd:
    name: intercomd.service
    state: restarted
    daemon_reload: true

- name: Restart intercom audio sender if running
  ansible.builtin.systemd:
    name: intercom-audio-tx.service
    state: restarted
    daemon_reload: true
  when: "ansible_facts.get('services', {}).get('intercom-audio-tx.service', {}).get('state', '') == 'running'"

- name: Reboot intercom indoor
  # I2S-Overlays (config.txt) und PipeWire-Session-Konfigurationen wirken
  # erst nach einem Boot; Session-Restarts zerstoeren die AEC-Verkettung
  # (Historie 2026-11-10, siehe REDEPLOY.md). Alle Dienste (intercom-app,
  # intercomd, intercom-audio-tx) sind systemd-aktiviert und kommen nach
  # dem Reboot selbst wieder hoch.
  ansible.builtin.reboot:
    reboot_timeout: 300
