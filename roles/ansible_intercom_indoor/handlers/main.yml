---
- name: Restart intercomd
  ansible.builtin.systemd:
    name: intercomd.service
    state: restarted
    daemon_reload: true

- name: Restart intercom audio sender if running
  ansible.builtin.systemd:
    name: intercom-audio-tx.service
    state: restarted
    daemon_reload: true
  when: "ansible_facts.get('services', {}).get('intercom-audio-tx.service', {}).get('state', '') == 'running'"
