---
- name: "Intercom indoor - Validate credentials"
  ansible.builtin.assert:
    that:
      - intercom_mqtt_password | length > 0
    fail_msg: "intercom_mqtt_password fehlt (vaulted in host_vars eintragen)."

- name: "Intercom indoor - Install python packages"
  ansible.builtin.apt:
    name:
      - python3-paho-mqtt
      - python3-prometheus-client
      - gstreamer1.0-tools
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-alsa
    state: present

# ---------------- Boot-Konfiguration (config.txt) ----------------
- name: "Intercom indoor - Manage config.txt overlay (INMP441 mic)"
  ansible.builtin.blockinfile:
    path: "{{ intercom_config_txt_path }}"
    marker: "# {mark} ANSIBLE MANAGED - role ansible_intercom_indoor"
    block: "{{ intercom_config_txt_block }}"
  # Das I2S-Overlay laedt nur beim Boot -> Reboot-Handler.
  notify: Reboot intercom indoor for config.txt

- name: "Intercom indoor - Ensure directory"
  ansible.builtin.file:
    path: /opt/intercom
    state: directory
    mode: "0755"

- name: "Intercom indoor - Render daemon"
  ansible.builtin.template:
    src: intercomd.py.j2
    dest: /opt/intercom/intercomd.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart intercomd

- name: "Intercom indoor - systemd unit (intercomd)"
  ansible.builtin.template:
    src: intercomd.service.j2
    dest: /etc/systemd/system/intercomd.service
    mode: "0644"
  notify: Restart intercomd

- name: "Intercom indoor - systemd unit (audio sender)"
  ansible.builtin.template:
    src: intercom-audio-tx.service.j2
    dest: /etc/systemd/system/intercom-audio-tx.service
    mode: "0644"
  notify: Restart intercom audio sender if running

- name: "Intercom indoor - Enable intercomd"
  ansible.builtin.systemd:
    name: intercomd.service
    enabled: true
    state: started
    daemon_reload: true
