---
- name: Non-OpenWrt tasks
  when: ansible_distribution != 'OpenWrt'
  block:

    - name: Initialize an empty dict for host keys
      ansible.builtin.set_fact:
        _temp_host_keys_nonopenwrt: {}

    - name: Slurp SSH public keys from host
      ansible.builtin.slurp:
        src: "/etc/ssh/ssh_host_{{ item }}_key.pub"
      register: ssh_public_keys_nonopenwrt
      ignore_errors: true
      loop:
        - ed25519
        - rsa
        - ecdsa

    - name: Parse and combine keys into a structured dictionary
      ansible.builtin.set_fact:
        _temp_host_keys_nonopenwrt: >-
          {{
            _temp_host_keys_nonopenwrt | default({}) | combine({
              item.item: {
                'keytype': (item.content | b64decode).split(' ')[0],
                'keydata': (item.content | b64decode).split(' ')[1]
              }
            })
          }}
      when: item.failed is not defined or not item.failed
      loop: "{{ ssh_public_keys_nonopenwrt.results }}"
      no_log: true

    - name: Format keys under the inventory hostname
      ansible.builtin.set_fact:
        host_ssh_dict_nonopenwrt: "{{ {inventory_hostname: _temp_host_keys_nonopenwrt} }}"

    # - name: debug
    #   debug:
    #     var: host_ssh_dict_nonopenwrt

# WRITING THE DATA

- name: Ensure SSH data output directory exists
  ansible.builtin.file:
    path: "{{ system_sshkeys_collect_data_filepath }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false

- name: Write ssh_host_keys dictionary to an Ansible vars file
  ansible.builtin.copy:
    content: |
      ---
      # Generated by Ansible - Host SSH Public Keys
      ssh_host_keys:
      {% for host in ansible_play_hosts %}
      {% set host_keys = (hostvars[host]['host_ssh_dict_openwrt'] | default({}) | combine(hostvars[host]['host_ssh_dict_nonopenwrt'] | default({}), recursive=True))[host] | default({}) %}
      {% if host_keys %}
        {{ host }}:
          {{ host_keys | to_nice_yaml(indent=2) | indent(4) }}
      {% endif %}
      {% endfor %}
    dest: "{{ system_sshkeys_collect_data_filepath }}/{{ system_sshkeys_collect_data_filename }}"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true

- name: Deploy SSH public keys to system-wide known_hosts on target hosts
  ansible.builtin.known_hosts:
    name: "{{ item.host }}"
    key: "{{ item.host }} {{ item.keytype }} {{ item.keydata }}"
    path: "{{ system_sshkeys_known_hosts_path }}"
    state: present
  loop: >-
    {%- set keys_list = [] -%}
    {%- for host in ansible_play_hosts -%}
      {%- set host_keys = (hostvars[host]['host_ssh_dict_openwrt'] | default({}) | combine(hostvars[host]['host_ssh_dict_nonopenwrt'] | default({}), recursive=True))[host] | default({}) -%}
      {%- for keytype, keyinfo in host_keys.items() -%}
        {%- set _ = keys_list.append({'host': host, 'keytype': keyinfo.keytype, 'keydata': keyinfo.keydata}) -%}
      {%- endfor -%}
    {%- endfor -%}{{ keys_list }}
  when: ansible_distribution != 'OpenWrt'
  become: true
