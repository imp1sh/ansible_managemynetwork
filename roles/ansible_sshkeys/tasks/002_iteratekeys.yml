---
# Pretasks
- name: MMN sshkeys - Iterating over key {{ sshkey.key }}
  ansible.builtin.debug:
    var: sshkey.key

- name: MMN sshkeys - Set system_sshkeys_isingroup and system_sshkeys_isinlist initially to False
  ansible.builtin.set_fact:
    system_sshkeys_isingroup: False
    system_sshkeys_isinlist: False

# Check for group based assignments
# system_sshkeys_elementcheck_group will turn true if the sshkey we're currently iterating over is existent
# in system_sshkeys_deploy_on_hostgroups
- name: MMN sshkeys - Check if subelement exists
  ansible.builtin.set_fact:
    system_sshkeys_elementcheck_group: "{{ system_sshkeys_deploy_on_hostgroups[sshkey.key] is defined }}"

# Check if the host we're running on is in the Ansible group that's defined in system_sshkeys_deploy_on_hostgroups
# This way we make sure the key is only distributed if it's a match
- name: MMN sshkeys - Check if key is in group
  ansible.builtin.set_fact:
    system_sshkeys_isingroup: True
  when:
    - system_sshkeys_elementcheck_group
    - system_sshkeys_deploy_on_hostgroups[sshkey.key]['hostgroups'] | intersect(group_names) | length > 0

# This will contain the list of what users on the target machine are supposed to receive the ssh key
- name: MMN sshkeys - Get destination username from group assignment
  ansible.builtin.set_fact:
    system_sshkeys_destinationusers: "{{ system_sshkeys_deploy_on_hostgroups[sshkey.key]['users'] }}"
  when: system_sshkeys_isingroup

# Check for individual host assigments
# After checking system_sshkeys_deploy_on_hostgroups (above) we'll now check if we should deploy
# by checking system_sshkeys_deploy_on_hosts var
- name: MMN sshkeys - Individual assignments by hostname instead of groupname
  block:
    - name: MMN sshkeys - Check if subelement exists in individual list
      ansible.builtin.set_fact:
        system_sshkeys_elementcheck_individual: "{{ system_sshkeys_deploy_on_hosts[sshkey.key] is defined }}"

    - name: MMN sshkeys - Check if key is in hostlist
      ansible.builtin.set_fact:
        system_sshkeys_isinlist: "{{ inventory_hostname in system_sshkeys_deploy_on_hosts[sshkey.key] }}"
      when: system_sshkeys_elementcheck_individual

    - name: MMN sshkeys - Get destination username from individual assignment
      ansible.builtin.set_fact:
        system_sshkeys_destinationusers: "{{ system_sshkeys_deploy_on_hosts[sshkey.key]['users'] }}"
      when: system_sshkeys_isinlist
  when: not system_sshkeys_isingroup
  # Challenge that condition! Is there a corner case where I want to
  # deploy a key that comes out of the system_sshkeys_deploy_on_hostgroups
  # assignment but ALSO from the system_sshkeys_deploy_on_hosts assignment?

- name: MMN sshkeys - Block task if key shall be deployed on this very host
  block:
    - name: MMN sshkeys - The key will be handled
      ansible.builtin.debug:
        var: sshkey.key
    - name: MMN sshkeys - Deploy key
      ansible.builtin.include_tasks: 003_justdoit.yml
      loop: "{{ system_sshkeys_destinationusers }}"
      loop_control:
        loop_var: destinationuser
  when: (system_sshkeys_isinlist) or (system_sshkeys_isingroup)
