---
- name: "MMN dnsdist - Include OS-specific variables"
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"
  when: dnsdist_dist_is_container | default(false) | bool is false

- name: "MMN dnsdist - Non-container tasks"
  when:
    - not dnsdist_dist_is_container | default(false) | bool
  block:
    - name: "MMN dnsdist - Install package"
      ansible.builtin.package:
        name: "{{ dnsdist_package_name }}"
        state: present

    - name: "MMN dnsdist - Ensure config directory exists"
      ansible.builtin.file:
        path: "{{ dnsdist_config_path | dirname }}"
        state: directory
        mode: '0755'
      when: dnsdist_config_path | dirname != '/etc'

    - name: "MMN dnsdist - Deploy config file"
      ansible.builtin.template:
        src: dnsdist.conf.j2
        dest: "{{ dnsdist_config_path }}"
        owner: "{{ dnsdist_user }}"
        group: "{{ dnsdist_group }}"
        mode: '0640'
      notify: restart dnsdist
      when: not dnsdist_disable_handlers | bool

    - name: "MMN dnsdist - Deploy config file (no handler)"
      ansible.builtin.template:
        src: dnsdist.conf.j2
        dest: "{{ dnsdist_config_path }}"
        owner: "{{ dnsdist_user }}"
        group: "{{ dnsdist_group }}"
        mode: '0640'
      when: dnsdist_disable_handlers | bool

    - name: "MMN dnsdist - Configure service"
      ansible.builtin.service:
        name: dnsdist
        state: "{{ dnsdist_service_state }}"
        enabled: "{{ dnsdist_service_enabled }}"

- name: "MMN dnsdist - Alpine OpenRC service file"
  ansible.builtin.template:
    src: openrc.j2
    dest: /etc/init.d/dnsdist
    mode: '0740'
  notify: restart dnsdist
  when:
    - ansible_os_family == "Alpine"
    - not dnsdist_disable_handlers | bool

- name: "MMN dnsdist - Container tasks"
  when:
    - dnsdist_dist_is_container | default(false) | bool
  block:
    - name: "MMN dnsdist - include Container vars"
      ansible.builtin.include_vars: "Container.yml"

    - name: "MMN dnsdist - Ensure config directory exists"
      ansible.builtin.file:
        path: "{{ dnsdist_path_config }}"
        state: directory
        mode: '0755'

    - name: "MMN dnsdist - Deploy config file (YAML, no adblock)"
      ansible.builtin.template:
        src: dnsdist.yml.j2
        dest: "{{ dnsdist_path_config }}/dnsdist.yml"
        mode: '0644'
      notify: restart dnsdist container
      when: not dnsdist_adblock_enable | default(false) | bool

    - name: "MMN dnsdist - Deploy config file (Lua, with adblock)"
      ansible.builtin.template:
        src: dnsdist.conf.j2
        dest: "{{ dnsdist_path_config }}/dnsdist.conf"
        mode: '0644'
      notify: restart dnsdist container
      when: dnsdist_adblock_enable | default(false) | bool

    - name: "MMN dnsdist - Remove unused config files"
      ansible.builtin.file:
        path: "{{ dnsdist_path_config }}/{{ item }}"
        state: absent
      loop:
        - "dnsdist.yml"
        - "dnsdist.lua"
      when: dnsdist_adblock_enable | default(false) | bool

    - name: "MMN dnsdist - Remove unused config file (no adblock)"
      ansible.builtin.file:
        path: "{{ dnsdist_path_config }}/dnsdist.conf"
        state: absent
      when: not dnsdist_adblock_enable | default(false) | bool

    - name: "MMN dnsdist - Ensure adblock directories exist"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ dnsdist_path_config }}/adblock"
        - "{{ dnsdist_path_config }}/adblock/lists"
      when: dnsdist_adblock_enable | default(false) | bool

    - name: "MMN dnsdist - Clone dagg-ffi repository"
      ansible.builtin.git:
        repo: "https://github.com/hautecodure/dnsdist-adblock.git"
        dest: "{{ dnsdist_path_config }}/adblock/dagg-src"
        depth: 1
      when: dnsdist_adblock_enable | default(false) | bool

    - name: "MMN dnsdist - Build libdagg.so"
      ansible.builtin.shell:
        cmd: make clean && make
        chdir: "{{ dnsdist_path_config }}/adblock/dagg-src/dagg-ffi/libdagg"
        creates: "{{ dnsdist_path_config }}/adblock/dagg-src/dagg-ffi/libdagg/libdagg.so"
      when: dnsdist_adblock_enable | default(false) | bool

    - name: "MMN dnsdist - Copy libdagg.so to config dir"
      ansible.builtin.copy:
        src: "{{ dnsdist_path_config }}/adblock/dagg-src/dagg-ffi/libdagg/libdagg.so"
        dest: "{{ dnsdist_path_config }}/adblock/libdagg.so"
        remote_src: true
        mode: '0755'
      when: dnsdist_adblock_enable | default(false) | bool

    - name: "MMN dnsdist - Deploy adblock updater script"
      ansible.builtin.template:
        src: adblock-update.sh.j2
        dest: "{{ dnsdist_path_config }}/adblock/adblock-update.sh"
        mode: '0755'
      when: dnsdist_adblock_enable | default(false) | bool

    - name: "MMN dnsdist - Deploy adblock cron entrypoint"
      ansible.builtin.template:
        src: adblock-cron-entrypoint.sh.j2
        dest: "{{ dnsdist_path_config }}/adblock/entrypoint.sh"
        mode: '0755'
      when: dnsdist_adblock_enable | default(false) | bool
