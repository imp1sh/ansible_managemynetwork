---
# ansible_thunar — manages Thunar file manager configuration per-user.
# Deploys three files:
#   1. ~/.config/xfce4/xfconf/xfce-perchannel-xml/thunar.xml  (view prefs, sort, misc)
#   2. ~/.config/Thunar/accels.scm                             (keyboard accelerators)
#   3. ~/.config/Thunar/uca.xml                                (custom actions)
#
# Settings are driven entirely by the thunar_settings dict and the
# thunar_custom_actions list — set them in group_vars/host_vars to
# steer per-group or per-host.

# ---------------------------------------------------------------------------
# Target user(s). String or list. Null → uses ansible_user.
# ---------------------------------------------------------------------------
thunar_users: null

# ---------------------------------------------------------------------------
# Xfconf properties — rendered into thunar.xml.
# Each key maps to an Xfconf property name; value is a dict with
# 'type' (string|int|bool) and 'value'.
# Override individual keys in group_vars/host_vars without rewriting
# the whole dict by using Ansible's hash_behaviour or combine filter.
# ---------------------------------------------------------------------------
thunar_settings:
  last-view:
    type: string
    value: "ThunarDetailsView"
  last-icon-view-zoom-level:
    type: string
    value: "THUNAR_ZOOM_LEVEL_200_PERCENT"
  last-window-maximized:
    type: bool
    value: false
  last-separator-position:
    type: int
    value: 260
  last-window-width:
    type: int
    value: 1016
  last-window-height:
    type: int
    value: 567
  last-details-view-zoom-level:
    type: string
    value: "THUNAR_ZOOM_LEVEL_38_PERCENT"
  last-details-view-column-widths:
    type: string
    value: "50,50,147,138,98,211,50,50,454,50,50,75,50,419"
  last-sort-column:
    type: string
    value: "THUNAR_COLUMN_NAME"
  last-sort-order:
    type: string
    value: "GTK_SORT_ASCENDING"
  misc-single-click:
    type: bool
    value: false
  misc-use-csd:
    type: bool
    value: false
  default-view:
    type: string
    value: "ThunarDetailsView"
  misc-text-beside-icons:
    type: bool
    value: false
  misc-date-style:
    type: string
    value: "THUNAR_DATE_STYLE_YYYYMMDD"
  misc-change-window-icon:
    type: bool
    value: true
  shortcuts-icon-size:
    type: string
    value: "THUNAR_ICON_SIZE_32"
  tree-icon-size:
    type: string
    value: "THUNAR_ICON_SIZE_16"
  misc-symbolic-icons-in-sidepane:
    type: bool
    value: false
  misc-image-preview-mode:
    type: string
    value: "THUNAR_IMAGE_PREVIEW_MODE_STANDALONE"
  misc-full-path-in-tab-title:
    type: bool
    value: true
  misc-show-delete-action:
    type: bool
    value: true

# ---------------------------------------------------------------------------
# Custom actions — rendered into uca.xml.
# Each entry is a dict with: icon, name, submenu, unique-id, command,
# description, range, patterns, startup-notify, directories/(folders-only),
# text-files, image-files, other-files, audio-files, video-files.
# ---------------------------------------------------------------------------
thunar_custom_actions:
  - icon: "utilities-terminal"
    name: "Terminal hier öffnen"
    submenu: ""
    unique_id: "1744900021289548-1"
    command: "exo-open --working-directory %f --launch TerminalEmulator"
    description: "Öffnet ein Terminal im aktuellen Verzeichnis"
    range: ""
    patterns: "*"
    startup_notify: true
    directories: true

# ---------------------------------------------------------------------------
# Keyboard accelerators — deployed as a static file.
# The accels.scm format is Scheme-like and not amenable to templating
# without duplicating Thunar's internal action namespace. Deploy the
# stock defaults; override with a custom file via thunar_accels_src if
# you have captured a personalised map.
# ---------------------------------------------------------------------------
thunar_accels_src: "accels.scm"
