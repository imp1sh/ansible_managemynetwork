---
# ansible_thunar — manages Thunar file manager configuration per-user.
# Deploys three files:
#   1. ~/.config/xfce4/xfconf/xfce-perchannel-xml/thunar.xml  (view prefs, sort, misc)
#   2. ~/.config/Thunar/accels.scm                             (keyboard accelerators)
#   3. ~/.config/Thunar/uca.xml                                (custom actions)
#
# Per-user overrides: set thunar_configs and/or thunar_custom_action_configs
# as dicts keyed by username. thunar_configs entries are shallow-merged over
# thunar_settings (individual Xfconf properties replaced). 
# thunar_custom_action_configs entries REPLACE the base thunar_custom_actions
# list entirely (different users likely want different action sets).

# ---------------------------------------------------------------------------
# Target user(s). String or list. Null → uses ansible_user.
# ---------------------------------------------------------------------------
thunar_users: null

# ---------------------------------------------------------------------------
# Xfconf properties — rendered into thunar.xml.
# Each key maps to an Xfconf property name; value is a dict with
# 'type' (string|int|bool) and 'value'.
# ---------------------------------------------------------------------------
thunar_settings:
  last-view:
    type: string
    value: "ThunarDetailsView"
  last-icon-view-zoom-level:
    type: string
    value: "THUNAR_ZOOM_LEVEL_200_PERCENT"
  last-window-maximized:
    type: bool
    value: false
  last-separator-position:
    type: int
    value: 260
  last-window-width:
    type: int
    value: 1016
  last-window-height:
    type: int
    value: 567
  last-details-view-zoom-level:
    type: string
    value: "THUNAR_ZOOM_LEVEL_38_PERCENT"
  last-details-view-column-widths:
    type: string
    value: "50,50,147,138,98,211,50,50,454,50,50,75,50,419"
  last-sort-column:
    type: string
    value: "THUNAR_COLUMN_NAME"
  last-sort-order:
    type: string
    value: "GTK_SORT_ASCENDING"
  misc-single-click:
    type: bool
    value: false
  misc-use-csd:
    type: bool
    value: false
  default-view:
    type: string
    value: "ThunarDetailsView"
  misc-text-beside-icons:
    type: bool
    value: false
  misc-date-style:
    type: string
    value: "THUNAR_DATE_STYLE_YYYYMMDD"
  misc-change-window-icon:
    type: bool
    value: true
  shortcuts-icon-size:
    type: string
    value: "THUNAR_ICON_SIZE_32"
  tree-icon-size:
    type: string
    value: "THUNAR_ICON_SIZE_16"
  misc-symbolic-icons-in-sidepane:
    type: bool
    value: false
  misc-image-preview-mode:
    type: string
    value: "THUNAR_IMAGE_PREVIEW_MODE_STANDALONE"
  misc-full-path-in-tab-title:
    type: bool
    value: true
  misc-show-delete-action:
    type: bool
    value: true

# ---------------------------------------------------------------------------
# Per-user settings overrides — keyed by username, shallow-merged over
# thunar_settings. Individual Xfconf properties are replaced, not deep-merged.
# ---------------------------------------------------------------------------
thunar_configs: {}
# Example:
# thunar_configs:
#   jochen:
#     misc-single-click:
#       type: bool
#       value: false
#   alice:
#     misc-single-click:
#       type: bool
#       value: true
#     default-view:
#       type: string
#       value: "ThunarIconView"

# ---------------------------------------------------------------------------
# Custom actions — rendered into uca.xml.
# Each entry is a dict with: icon, name, submenu, unique_id, command,
# description, range, patterns, startup_notify, and boolean appearance
# flags (directories, text_files, image_files, other_files, audio_files,
# video_files).
# ---------------------------------------------------------------------------
thunar_custom_actions:
  - icon: "utilities-terminal"
    name: "Terminal hier öffnen"
    submenu: ""
    unique_id: "1744900021289548-1"
    command: "exo-open --working-directory %f --launch TerminalEmulator"
    description: "Öffnet ein Terminal im aktuellen Verzeichnis"
    range: ""
    patterns: "*"
    startup_notify: true
    directories: true

# ---------------------------------------------------------------------------
# Per-user custom actions overrides — keyed by username.
# REPLACES the base thunar_custom_actions list entirely for that user.
# Users not listed here get the base thunar_custom_actions verbatim.
# ---------------------------------------------------------------------------
thunar_custom_action_configs: {}
# Example:
# thunar_custom_action_configs:
#   jochen:
#     - icon: "utilities-terminal"
#       name: "Terminal hier öffnen"
#       unique_id: "1744900021289548-1"
#       command: "exo-open --working-directory %f --launch TerminalEmulator"
#       description: "Öffnet ein Terminal im aktuellen Verzeichnis"
#       patterns: "*"
#       startup_notify: true
#       directories: true
#     - icon: "document-open"
#       name: "Mit Editor öffnen"
#       unique_id: "1744900021289548-2"
#       command: "xed %f"
#       description: "Datei mit xed öffnen"
#       patterns: "*.txt"
#       startup_notify: true
#       text_files: true
#   alice:
#     - icon: "utilities-terminal"
#       name: "Open Terminal Here"
#       unique_id: "1744900021289548-3"
#       command: "exo-open --working-directory %f --launch TerminalEmulator"
#       description: "Open a terminal in the current directory"
#       patterns: "*"
#       startup_notify: true
#       directories: true

# ---------------------------------------------------------------------------
# Keyboard accelerators — deployed as a static file.
# The accels.scm format is Scheme-like and not amenable to templating
# without duplicating Thunar's internal action namespace. Deploy the
# stock defaults; override with a custom file via thunar_accels_src if
# you have captured a personalised map.
# ---------------------------------------------------------------------------
thunar_accels_src: "accels.scm"
