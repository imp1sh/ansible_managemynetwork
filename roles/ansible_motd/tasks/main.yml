---
- name: Setup MOTD Linux
  ansible.builtin.template:
    src: motd
    dest: /etc/motd
    owner: root
    group: root
    mode: 0644
  when: ansible_facts['os_family'] | default('') in ["RedHat", "Alpine", "Debian", "Archlinux"]
- name: FreeBSD 12 setup MOTD
  ansible.builtin.template:
    src: motd
    dest: /etc/motd
    owner: root
    group: wheel
    mode: 0644
  when:
    - ansible_facts['os_family'] | default('') == "FreeBSD"
    - ansible_distribution_major_version | default('0') | int <= 12
- name: FreeBSD 13+ setup MOTD
  ansible.builtin.template:
    src: motd
    dest: /etc/motd.template
    owner: root
    group: wheel
    mode: 0644
  when:
    - ansible_facts['os_family'] | default('') == "FreeBSD"
    - ansible_distribution_major_version | default('0') | int >= 13
  notify: restart motd
- name: FreeBSD 13+ set update_motd
  ansible.builtin.template:
    src: rc.conf.jinja2
    dest: /etc/rc.conf.d/motd
    owner: root
    group: wheel
    mode: 0644
  when:
    - ansible_facts['os_family'] | default('') == "FreeBSD"
    - ansible_distribution_major_version | default('0') | int >= 13
