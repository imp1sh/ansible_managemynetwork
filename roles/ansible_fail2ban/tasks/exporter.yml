---
- name: "MMN fail2ban - Ensure textfile collector directory exists"
  ansible.builtin.file:
    path: "{{ fail2ban_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "MMN fail2ban - Deploy exporter script"
  ansible.builtin.template:
    src: fail2ban-exporter.py.j2
    dest: "{{ fail2ban_exporter_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: "MMN fail2ban - Deploy exporter systemd service"
  ansible.builtin.template:
    src: fail2ban-exporter.service.j2
    dest: "/etc/systemd/system/fail2ban-exporter.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban exporter timer

- name: "MMN fail2ban - Deploy exporter systemd timer"
  ansible.builtin.template:
    src: fail2ban-exporter.timer.j2
    dest: "/etc/systemd/system/fail2ban-exporter.timer"
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban exporter timer

- name: "MMN fail2ban - Enable and start exporter timer"
  ansible.builtin.systemd:
    name: "fail2ban-exporter.timer"
    state: started
    enabled: true
    daemon_reload: true
