---
# Mode B: declare a repository inline. Parameters mirror
# ansible.builtin.yum_repository; the essentials are wired explicitly and the
# remaining knobs fall back to the module's own defaults via `default(omit)`.

- name: "MMN dnfrepos - Configure inline repository"
  ansible.builtin.yum_repository:
    file: "{{ item.value.filename | default(item.key) }}"
    name: "{{ item.value.name | default(item.key) }}"
    description: "{{ item.value.description | default(item.value.name | default(item.key)) }}"
    state: "{{ item.value.state | default('present') }}"
    baseurl: "{{ item.value.baseurl | default(omit) }}"
    metalink: "{{ item.value.metalink | default(omit) }}"
    mirrorlist: "{{ item.value.mirrorlist | default(omit) }}"
    enabled: "{{ item.value.enabled | default(omit) }}"
    gpgcheck: "{{ item.value.gpgcheck | default(omit) }}"
    gpgkey: "{{ item.value.gpgkey | default(omit) }}"
    repo_gpgcheck: "{{ item.value.repo_gpgcheck | default(omit) }}"
    priority: "{{ item.value.priority | default(omit) }}"
    exclude: "{{ item.value.exclude | default(omit) }}"
    includepkgs: "{{ item.value.includepkgs | default(omit) }}"
    proxy: "{{ item.value.proxy | default(omit) }}"
    sslverify: "{{ item.value.sslverify | default(omit) }}"
    protect: "{{ item.value.protect | default(omit) }}"
    module_hotfixes: "{{ item.value.module_hotfixes | default(omit) }}"
  loop: "{{ dnf_repos | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value.url is not defined

- name: "MMN dnfrepos - Import GPG key for inline repos"
  ansible.builtin.rpm_key:
    key: "{{ item.value.gpgkey }}"
    state: present
  loop: "{{ dnf_repos | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - dnf_repos_import_gpg_keys | bool
    - item.value.url is not defined
    - item.value.gpgkey is defined
    - item.value.state | default('present') == 'present'
