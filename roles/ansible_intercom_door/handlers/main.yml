---
- name: Restart intercom door
  ansible.builtin.systemd:
    name: intercom-door.service
    state: restarted
    daemon_reload: true

- name: Restart intercom audio receiver
  ansible.builtin.systemd:
    name: intercom-audio-rx.service
    state: restarted
    daemon_reload: true

- name: Restart intercom camera
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - intercom-cam-video.service
    - intercom-cam-audio.service

- name: Restart intercom mic volume
  ansible.builtin.command: >
    systemctl --user -M {{ intercom_pipewire_user }}@.host restart set-mic-volume.service
  changed_when: false

- name: Restart intercom mediamtx
  ansible.builtin.systemd:
    name: mediamtx.service
    state: restarted
    daemon_reload: true

- name: Restart intercom pipewire session
  # Kompletter REBOOT statt Session-/Service-Restarts: Sowohl einzelne
  # pipewire/wireplumber-Restarts (aec.capture haengt an der toten Mikro-
  # Node) als auch loginctl terminate-user (WirePlumber crasht danach bei
  # jedem Neustart im Komponenten-Laden) zerstoeren die Audio-Kette.
  # Nur der Boot bringt die Verkettung zuverlaessig zurueck (Historie
  # 2026-11-10, Details in REDEPLOY.md). Die ffmpeg-Dienste starten per
  # Restart=always nach dem Boot selbst wieder.
  ansible.builtin.reboot:
    reboot_timeout: 300
    test_command: "systemctl --user -M intercom@.host is-active pipewire.service"
