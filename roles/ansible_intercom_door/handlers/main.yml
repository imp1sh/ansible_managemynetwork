---
- name: Restart intercom door
  ansible.builtin.systemd:
    name: intercom-door.service
    state: restarted
    daemon_reload: true

- name: Restart intercom audio receiver
  ansible.builtin.systemd:
    name: intercom-audio-rx.service
    state: restarted
    daemon_reload: true

- name: Restart intercom camera
  ansible.builtin.systemd:
    name: intercom-cam.service
    state: restarted
    daemon_reload: true

- name: Restart intercom mediamtx
  ansible.builtin.systemd:
    name: mediamtx.service
    state: restarted
    daemon_reload: true

- name: Restart intercom pipewire
  ansible.builtin.command: >
    systemctl --user -M {{ intercom_pipewire_user }}@.host restart pipewire.service
  changed_when: false

- name: Restart intercom wireplumber
  ansible.builtin.command: >
    systemctl --user -M {{ intercom_pipewire_user }}@.host restart wireplumber.service
  changed_when: false
