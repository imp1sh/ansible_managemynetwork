---
# ansible_intercom_door — Tuerstation doorpi0: ein Daemon fuer alles.
#
# intercom-door vereint: Taster (GPIO), Gong-Relais (GPIO), SHTC3 (I2C),
# REST-API, Web-GUI, Prometheus-Exporter und MQTT. Der alte, separate
# Taster-Dienst (intercom-door-button) wird entfernt.
#
# Audioempfaenger (Opus/RTP -> Klinke) bleibt ein eigener Dienst
# (intercom-audio-rx), da er ein eigenes Media-Pipeline-Handling ist.

intercom_broker_host: "mqtt0.t.libcom.de"
intercom_broker_port: 8883
intercom_ca_file: "/etc/ssl/certs/ca-certificates.crt"
intercom_mqtt_username: "doorpi0"
intercom_mqtt_password: ""

# --- GPIO ---
intercom_gpio_line: 17
intercom_button_bounce: 0.1
intercom_button_debounce: 0.6

# --- Gong-Relais (Honeywell D117) ---
# Verifizierte Verdrahtung: Relais-NC in Reihe mit Klemme 0/3
# (Details: Projekt-Doku WIRING.md).
intercom_gong_enabled: true
intercom_gong_gpio: 24
intercom_gong_active_high: false
intercom_gong_pulse: 0.2
intercom_gong_on_hangup: false

# --- SHTC3 Temperatur-/Feuchtesensor ---
intercom_sensor_bus: "/dev/i2c-3"
intercom_sensor_addr: 0x70
intercom_sensor_interval: 10

# --- HTTP (API/Web/Metriken), laeuft nur lokal; aussen via traefik ---
intercom_http_host: "127.0.0.1"
intercom_http_port: 8090

# --- Event-Log (nur RAM, Ringpuffer) ---
intercom_event_buffer: 500

# --- MQTT-Topics ---
intercom_topic_event: "intercom/door/event"
intercom_topic_presence: "intercom/door/presence"
intercom_topic_button: "intercom/door/button"
intercom_topic_relay: "intercom/door/relay"

# --- Audioempfaenger (Opus/RTP -> Klinke) ---
intercom_audio_rx_port: 5004

# --- Kamera (CSI, libcamera/rpicam; Push an go2rtc) ---
# Der Dienst rpicam-vid | ffmpeg push't H264 an den RTSP-Server von go2rtc
# (Stream-Quelle in go2rtc bleibt leer, siehe host_vars).
intercom_cam_device: 0
intercom_cam_width: 1280
intercom_cam_height: 720
intercom_cam_framerate: 10
intercom_cam_bitrate: 1500000
intercom_cam_hflip: false
intercom_cam_vflip: false
intercom_cam_stream: "cam"
intercom_cam_rtsp_port: 8554

intercom_packages:
  - python3-paho-mqtt
  - python3-gpiozero
  - python3-lgpio
  - python3-fastapi
  - python3-uvicorn
  - python3-prometheus-client
  - rpicam-apps
  - ffmpeg
  - gstreamer1.0-tools
  - gstreamer1.0-plugins-good
  - gstreamer1.0-plugins-bad
  - gstreamer1.0-alsa
