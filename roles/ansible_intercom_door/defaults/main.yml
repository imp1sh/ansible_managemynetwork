---
# ansible_intercom_door — Tuerstation doorpi0: ein Daemon fuer alles.
#
# intercom-door vereint: Taster (GPIO), Gong-Relais (GPIO), SHTC3 (I2C),
# REST-API, Web-GUI, Prometheus-Exporter und MQTT. Der alte, separate
# Taster-Dienst (intercom-door-button) wird entfernt.
#
# Audioempfaenger (Opus/RTP -> Klinke) bleibt ein eigener Dienst
# (intercom-audio-rx), da er ein eigenes Media-Pipeline-Handling ist.

intercom_broker_host: "mqtt0.t.libcom.de"
intercom_broker_port: 8883
intercom_ca_file: "/etc/ssl/certs/ca-certificates.crt"
intercom_mqtt_username: "doorpi0"
intercom_mqtt_password: ""

# --- GPIO ---
intercom_gpio_line: 17
intercom_button_bounce: 0.1
intercom_button_debounce: 0.6

# --- Gong-Relais (Honeywell D117) ---
# Verifizierte Verdrahtung: Relais-NC in Reihe mit Klemme 0/3
# (Details: Projekt-Doku WIRING.md).
intercom_gong_enabled: true
intercom_gong_gpio: 24
intercom_gong_active_high: false
intercom_gong_pulse: 0.2
intercom_gong_on_hangup: false

# --- SHTC3 Temperatur-/Feuchtesensor ---
intercom_sensor_bus: "/dev/i2c-3"
intercom_sensor_addr: 0x70
intercom_sensor_interval: 10

# --- HTTP (API/Web/Metriken), laeuft nur lokal; aussen via traefik ---
intercom_http_host: "127.0.0.1"
intercom_http_port: 8090

# --- Event-Log (nur RAM, Ringpuffer) ---
intercom_event_buffer: 500

# --- MQTT-Topics ---
intercom_topic_event: "intercom/door/event"
intercom_topic_presence: "intercom/door/presence"
intercom_topic_button: "intercom/door/button"
intercom_topic_relay: "intercom/door/relay"

# --- Audioempfaenger (Opus/RTP -> Klinke) ---
intercom_audio_rx_port: 5004
# Wiedergabe-Geraet: AEC-Sink aus PipeWire (USB-Lautsprecher + Echo-Referenz)
intercom_audio_rx_device: "aecsink"

# --- PipeWire (User-Session fuer AEC) ---
# Dedizierter System-User mit Linger; PipeWire + WirePlumber laufen dort,
# das echo-cancel-Modul verbindet INMP441-Mikro und USB-Lautsprecher.
intercom_pipewire_user: "intercom"
intercom_pipewire_user_home: "/var/lib/intercom"
# Node-Namen in der PipeWire-Instanz (fuer echo-cancel.conf)
intercom_pipewire_mic_node: "alsa_input.platform-soc_sound.stereo-fallback"
intercom_pipewire_speaker_node: "alsa_output.usb-Jieli_Technology_USB_Composite_Device_A58D8A99786C4453-01.analog-stereo"

# --- AEC-Methode (pipewire module-echo-cancel) ---
# "speex": lineare Echokompensation — Gegenseite bleibt beim gleichzeitigen
# Sprechen vollstaendig verstaendlich. Messreihe 2026-11-10 (Gain 1.8):
#   Gegenseite (Gong) bei aktivem Uplink: -0.2 dBFS (praktisch ungedaempft)
#   Echo (Uplink-Ton): nur noch ~-13 dBFS im 1-kHz-Band (unter dem Gong)
# "webrtc": staerkere Echo-Unterdrueckung (~+26 dB), unterdrueckt aber die
# Gegenseite bei aktivem Lautsprecher um ~36 dB — fuer Gegensprechanlage
# unbrauchbar (Historie 2026-11-10, siehe TODO.md).
intercom_pipewire_aec_method: "speex"

# --- SSH-Automatisierungs-User: Audio-Stack maskieren ---
# pipewire/wireplumber in SSH-Login-Session crash-loopen (Journal-Flut,
# SSH-Timeouts, Historie 2026-11-10) — deshalb fuer den ansible-User
# komplett maskiert. Siehe Task-Kommentar in tasks/main.yml.
intercom_ssh_user: "ansible"
intercom_ssh_user_home: "/home/ansible"

# --- Schallpegel-Messung (SPL-Schaetzung) am Tuer-Mikrofon ---
# Der Pegelmesser liest das ROHMikrofon (ohne AEC/NS), damit die Anzeige
# die akustische Realitaet an der Tuer zeigt. XDG_RUNTIME_DIR verbindet
# den ffmpeg-Prozess mit der PipeWire-Session des Users intercom.
# Offset: INMP441 liefert -26 dBFS bei 94 dB SPL (120 dB Differenz).
# Der Node-Volume (intercom_mic_volume) hebt das Signal digital an;
# wpctl-Skala ist KUBISCH (linear = v^3, per pw-dump verifiziert):
# 3.0 -> 27-fach = +28.6 dB -> Offset 120 - 28.6 = 91.4.
intercom_level_meter: true
intercom_level_source: "rawmic"
intercom_level_xdg_runtime: "/run/user/{{ intercom_pipewire_uid | default('999') }}"
intercom_level_spl_offset: 91.4

# --- Mikrofon-Empfindlichkeit (INMP441) ---
# Node-Volume in der PipeWire-Session, wpctl-Skala (kubisch: linear = v^3):
# 1.0 = 0 dB, 2.0 = +18.1 dB, 3.0 = +28.6 dB, 4.0 = +36.1 dB.
# set-mic-volume.service setzt den Wert nach jedem PipeWire-Start neu;
# Aenderungen ueber die WebGUI landen in intercom_mic_volume_file und
# ueberleben damit Reboots.
intercom_mic_volume: "3.0"
intercom_mic_volume_file: "/var/lib/intercom/mic_volume"
intercom_mic_volume_max: "4.0"
# Lautsprecher-Pegel (USB/Jieli-Sink, wpctl-Skala): 1.0 = 100%. Wird nach
# jedem PipeWire-Start erzwungen — einst stand der Sink auf 0.4 (-24 dB),
# was den Uplink Innen -> Tuer praktisch unhoerbar machte (Historie 2026-11-10).
intercom_speaker_volume: "1.0"

# Mikrofon-Empfindlichkeit ueber WebGUI/API einstellbar (wpctl via runuser)
intercom_mic_control: true

# --- Boot-Konfiguration (config.txt) ---
# Verwalteter Block in der Kernel-Boot-Konfiguration (blockinfile, idempotent):
# I2C-Bus fuer den SHTC3-Sensor und das I2S-Overlay fuer das INMP441-Mikrofon.
# Hand-gesetzte Duplikate ausserhalb des Blocks wurden bei der Migration
# einmalig entfernt; seitdem haelt die Rolle allein den Block aktuell.
intercom_config_txt_path: "/boot/firmware/config.txt"
intercom_config_txt_block: |
  # Intercom: SHTC3 am Standard-I2C (Pin 3=SDA, Pin 5=SCL) -> /dev/i2c-1
  dtparam=i2c_arm=on
  # Intercom: INMP441 I2S-Mikrofon (GPIO18/19/20, siehe WIRING.md)
  dtoverlay=googlevoicehat-soundcard

# --- Kamera (CSI, libcamera/rpicam) ---
# intercom-cam pusht rpicam-vid (H264) + INMP441 (Opus) an den RTSP-Server
# mediamtx auf dem Host; go2rtc zieht den Strom als rtsp://-Quelle (preload).
intercom_cam_device: 0
intercom_cam_width: 1280
intercom_cam_height: 720
intercom_cam_framerate: 10
intercom_cam_bitrate: 1500000
intercom_cam_hflip: false
intercom_cam_vflip: false
# Freie rpicam-vid-Argumente, z. B. "--flush --denoise cdn_fast --sharpness 1.5"
intercom_cam_extra_args: ""

# --- mediamtx (RTSP-Server auf dem Host, Aufnahme von intercom-cam) ---
intercom_mediamtx_version: "1.21.3"
intercom_mediamtx_rtsp_port: 8553
intercom_mediamtx_path: "door"
intercom_mediamtx_video_path: "door_video"
intercom_mediamtx_audio_path: "door_audio"

# --- Audio (INMP441) im cam-Stream ---
# Opus im RTSP-Server des Kamera-Dienstes. 48 kbit/s mono, Modus "voip"
# (sprachoptimiert, SWB ~12 kHz) liegt deutlich ueber G.722;
# frame_duration 20 ms = ~26 ms Codec-Latenz.
# Quelle: aecsrc (PipeWire-echo-cancel, WebRTC-AEC). Der AEC entfernt das
# Echo des Tuer-Lautsprechers aus dem Mikrofonsignal (Full-Duplex ohne
# Selbsthoeren am Innengeraet). Messreihe 2026-11-10 (Mikro-Gain 1.8):
# Echo-Unterdrueckung +25.9 dB (Uplink-Ton -41.5 -> -67.4 dBFS),
# Gegenseite (Gong) nur -2.6 dB (-0.1 -> -2.7 dBFS).
# Fallback ohne Filterung: "rawmic" (Rohmikrofon).
intercom_cam_audio: true
intercom_cam_audio_card: "aecsrc"
intercom_cam_audio_bitrate: 48000
intercom_cam_audio_application: "voip"
intercom_cam_audio_frame_duration: 20

intercom_packages:
  - python3-paho-mqtt
  - python3-gpiozero
  - python3-lgpio
  - python3-fastapi
  - python3-uvicorn
  - python3-prometheus-client
  - rpicam-apps
  - ffmpeg
  - gstreamer1.0-tools
  - gstreamer1.0-plugins-good
  - gstreamer1.0-plugins-bad
  - gstreamer1.0-alsa
  - pipewire
  - pipewire-alsa
  - wireplumber
