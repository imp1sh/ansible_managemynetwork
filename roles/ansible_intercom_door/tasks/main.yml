---
- name: "Intercom door - Validate credentials"
  ansible.builtin.assert:
    that:
      - intercom_mqtt_password | length > 0
    fail_msg: "intercom_mqtt_password fehlt (vaulted in host_vars eintragen)."

- name: "Intercom door - Install packages"
  ansible.builtin.apt:
    name: "{{ intercom_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Intercom door - Ensure directory"
  ansible.builtin.file:
    path: /opt/intercom
    state: directory
    mode: "0755"

- name: "Intercom door - Render daemon"
  ansible.builtin.template:
    src: intercom-door.py.j2
    dest: /opt/intercom/intercom-door.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart intercom door

- name: "Intercom door - systemd unit (daemon)"
  ansible.builtin.template:
    src: intercom-door.service.j2
    dest: /etc/systemd/system/intercom-door.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart intercom door

- name: "Intercom door - systemd unit (audio receiver)"
  ansible.builtin.template:
    src: intercom-audio-rx.service.j2
    dest: /etc/systemd/system/intercom-audio-rx.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart intercom audio receiver

- name: "Intercom door - systemd unit (camera)"
  ansible.builtin.template:
    src: intercom-cam.service.j2
    dest: /etc/systemd/system/intercom-cam.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart intercom camera

- name: "Intercom door - Download mediamtx release"
  ansible.builtin.get_url:
    url: "https://github.com/bluenviron/mediamtx/releases/download/v{{ intercom_mediamtx_version }}/mediamtx_v{{ intercom_mediamtx_version }}_linux_arm64.tar.gz"
    dest: "/tmp/mediamtx_{{ intercom_mediamtx_version }}.tar.gz"
    mode: "0644"
  changed_when: false

- name: "Intercom door - Ensure mediamtx extraction dir"
  ansible.builtin.file:
    path: "/tmp/mediamtx_{{ intercom_mediamtx_version }}"
    state: directory
    mode: "0755"

- name: "Intercom door - Extract mediamtx"
  ansible.builtin.unarchive:
    src: "/tmp/mediamtx_{{ intercom_mediamtx_version }}.tar.gz"
    dest: "/tmp/mediamtx_{{ intercom_mediamtx_version }}"
    remote_src: true
    creates: "/tmp/mediamtx_{{ intercom_mediamtx_version }}/mediamtx"

- name: "Intercom door - Install mediamtx binary"
  ansible.builtin.copy:
    src: "/tmp/mediamtx_{{ intercom_mediamtx_version }}/mediamtx"
    dest: /usr/local/bin/mediamtx
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart intercom mediamtx

- name: "Intercom door - mediamtx configuration"
  ansible.builtin.template:
    src: mediamtx.yml.j2
    dest: /etc/mediamtx.yml
    owner: root
    group: root
    mode: "0644"
  notify: Restart intercom mediamtx

- name: "Intercom door - mediamtx systemd unit"
  ansible.builtin.template:
    src: mediamtx.service.j2
    dest: /etc/systemd/system/mediamtx.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart intercom mediamtx

- name: "Intercom door - Stop and disable legacy button service"
  ansible.builtin.systemd:
    name: intercom-door-button.service
    state: stopped
    enabled: false
    daemon_reload: true
  failed_when: false

- name: "Intercom door - Remove legacy button files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/intercom-door-button.service
    - /opt/intercom/doorpi0-button.py
  notify: Restart intercom door

- name: "Intercom door - Enable and start"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - intercom-door.service
    - intercom-audio-rx.service
    - intercom-cam.service
    - mediamtx.service
