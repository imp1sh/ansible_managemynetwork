---
- name: "Intercom door - Validate credentials"
  ansible.builtin.assert:
    that:
      - intercom_mqtt_password | length > 0
    fail_msg: "intercom_mqtt_password fehlt (vaulted in host_vars eintragen)."

- name: "Intercom door - Install packages"
  ansible.builtin.apt:
    name: "{{ intercom_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# ---------------- Boot-Konfiguration (config.txt) ----------------
- name: "Intercom door - Manage config.txt overlays (INMP441 + SHTC3)"
  ansible.builtin.blockinfile:
    path: "{{ intercom_config_txt_path }}"
    marker: "# {mark} ANSIBLE MANAGED - role ansible_intercom_door"
    block: "{{ intercom_config_txt_block }}"

# ---------------- PipeWire-Session fuer AEC (User intercom) ----------------
- name: "Intercom door - Ensure service user"
  ansible.builtin.user:
    name: "{{ intercom_pipewire_user }}"
    system: true
    create_home: true
    home: "{{ intercom_pipewire_user_home }}"
    groups: audio,video,render
    state: present

- name: "Intercom door - Enable linger for service user"
  ansible.builtin.command: "loginctl enable-linger {{ intercom_pipewire_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ intercom_pipewire_user }}"
  changed_when: false

- name: "Intercom door - Enable PipeWire session units"
  ansible.builtin.command: >
    systemctl --user -M {{ intercom_pipewire_user }}@.host
    enable pipewire.socket pipewire.service wireplumber.service
  changed_when: false

- name: "Intercom door - Ensure PipeWire config dirs"
  ansible.builtin.file:
    path: "{{ intercom_pipewire_user_home }}/.config/{{ item }}"
    state: directory
    owner: "{{ intercom_pipewire_user }}"
    group: "{{ intercom_pipewire_user }}"
    mode: "0755"
  loop:
    - pipewire/pipewire.conf.d
    - wireplumber/wireplumber.conf.d

- name: "Intercom door - PipeWire echo-cancel configuration"
  ansible.builtin.template:
    src: pipewire-echo-cancel.conf.j2
    dest: "{{ intercom_pipewire_user_home }}/.config/pipewire/pipewire.conf.d/90-echo-cancel.conf"
    owner: "{{ intercom_pipewire_user }}"
    group: "{{ intercom_pipewire_user }}"
    mode: "0644"
  notify: Restart intercom pipewire

- name: "Intercom door - PipeWire quantum configuration"
  ansible.builtin.template:
    src: pipewire-quantum.conf.j2
    dest: "{{ intercom_pipewire_user_home }}/.config/pipewire/pipewire.conf.d/50-quantum.conf"
    owner: "{{ intercom_pipewire_user }}"
    group: "{{ intercom_pipewire_user }}"
    mode: "0644"
  notify: Restart intercom pipewire

- name: "Intercom door - WirePlumber device monitor override"
  ansible.builtin.template:
    src: wireplumber-no-devices.conf.j2
    dest: "{{ intercom_pipewire_user_home }}/.config/wireplumber/wireplumber.conf.d/51-no-devices.conf"
    owner: "{{ intercom_pipewire_user }}"
    group: "{{ intercom_pipewire_user }}"
    mode: "0644"
  notify: Restart intercom wireplumber

- name: "Intercom door - Disable system-wide WirePlumber camera monitors"
  ansible.builtin.copy:
    dest: /etc/xdg/wireplumber/wireplumber.conf.d/51-disable-camera.conf
    content: |
      # Managed by Ansible (role ansible_intercom_door) - do not edit by hand.
      # Verhindert, dass ein systemweiter WirePlumber (z. B. root-Session)
      # die Kamera-Geraete belegt und rpicam-vid blockiert. Gueltig fuer alle
      # User-Sessions; die intercom-Session hat ihre eigene Deaktivierung in
      # ihrer Session-Konfiguration (51-no-devices.conf).
      wireplumber.components = [
        { type = virtual, provides = monitor.libcamera }
        { type = virtual, provides = monitor.v4l2 }
      ]
    owner: root
    group: root
    mode: "0644"

- name: "Intercom door - ALSA PCMs for AEC nodes"
  ansible.builtin.template:
    src: asoundrc.j2
    dest: "{{ intercom_pipewire_user_home }}/.asoundrc"
    owner: "{{ intercom_pipewire_user }}"
    group: "{{ intercom_pipewire_user }}"
    mode: "0644"

- name: "Intercom door - System-wide ALSA PCM for level meter"
  ansible.builtin.template:
    src: asound-system.conf.j2
    dest: /etc/asound.conf
    owner: root
    group: root
    mode: "0644"

- name: "Intercom door - Flush handler for PipeWire/WirePlumber restart"
  ansible.builtin.meta: flush_handlers

- name: "Intercom door - Ensure PipeWire session started"
  ansible.builtin.command: >
    systemctl --user -M {{ intercom_pipewire_user }}@.host
    start pipewire.socket pipewire.service wireplumber.service
  changed_when: false

- name: "Intercom door - Ensure user systemd directory"
  ansible.builtin.file:
    path: "{{ intercom_pipewire_user_home }}/.config/systemd/user"
    state: directory
    owner: "{{ intercom_pipewire_user }}"
    group: "{{ intercom_pipewire_user }}"
    mode: "0755"

- name: "Intercom door - Deploy mic volume script"
  ansible.builtin.template:
    src: set-mic-volume.sh.j2
    dest: /opt/intercom/set-mic-volume.sh
    owner: "{{ intercom_pipewire_user }}"
    group: "{{ intercom_pipewire_user }}"
    mode: "0755"
  notify: Restart intercom mic volume

- name: "Intercom door - systemd user unit (mic volume)"
  ansible.builtin.template:
    src: set-mic-volume.service.j2
    dest: "{{ intercom_pipewire_user_home }}/.config/systemd/user/set-mic-volume.service"
    owner: "{{ intercom_pipewire_user }}"
    group: "{{ intercom_pipewire_user }}"
    mode: "0644"
  notify: Restart intercom mic volume

- name: "Intercom door - Ensure directory"
  ansible.builtin.file:
    path: /opt/intercom
    state: directory
    mode: "0755"

- name: "Intercom door - Render daemon"
  ansible.builtin.template:
    src: intercom-door.py.j2
    dest: /opt/intercom/intercom-door.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart intercom door

- name: "Intercom door - systemd unit (daemon)"
  ansible.builtin.template:
    src: intercom-door.service.j2
    dest: /etc/systemd/system/intercom-door.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart intercom door

- name: "Intercom door - systemd unit (audio receiver)"
  ansible.builtin.template:
    src: intercom-audio-rx.service.j2
    dest: /etc/systemd/system/intercom-audio-rx.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart intercom audio receiver

- name: "Intercom door - systemd unit (camera video)"
  ansible.builtin.template:
    src: intercom-cam-video.service.j2
    dest: /etc/systemd/system/intercom-cam-video.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart intercom camera

- name: "Intercom door - systemd unit (camera audio)"
  ansible.builtin.template:
    src: intercom-cam-audio.service.j2
    dest: /etc/systemd/system/intercom-cam-audio.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart intercom camera

- name: "Intercom door - Download mediamtx release"
  ansible.builtin.get_url:
    url: "https://github.com/bluenviron/mediamtx/releases/download/v{{ intercom_mediamtx_version }}/mediamtx_v{{ intercom_mediamtx_version }}_linux_arm64.tar.gz"
    dest: "/tmp/mediamtx_{{ intercom_mediamtx_version }}.tar.gz"
    mode: "0644"
  changed_when: false

- name: "Intercom door - Ensure mediamtx extraction dir"
  ansible.builtin.file:
    path: "/tmp/mediamtx_{{ intercom_mediamtx_version }}"
    state: directory
    mode: "0755"

- name: "Intercom door - Extract mediamtx"
  ansible.builtin.unarchive:
    src: "/tmp/mediamtx_{{ intercom_mediamtx_version }}.tar.gz"
    dest: "/tmp/mediamtx_{{ intercom_mediamtx_version }}"
    remote_src: true
    creates: "/tmp/mediamtx_{{ intercom_mediamtx_version }}/mediamtx"

- name: "Intercom door - Install mediamtx binary"
  ansible.builtin.copy:
    src: "/tmp/mediamtx_{{ intercom_mediamtx_version }}/mediamtx"
    dest: /usr/local/bin/mediamtx
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart intercom mediamtx

- name: "Intercom door - mediamtx configuration"
  ansible.builtin.template:
    src: mediamtx.yml.j2
    dest: /etc/mediamtx.yml
    owner: root
    group: root
    mode: "0644"
  notify: Restart intercom mediamtx

- name: "Intercom door - mediamtx systemd unit"
  ansible.builtin.template:
    src: mediamtx.service.j2
    dest: /etc/systemd/system/mediamtx.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart intercom mediamtx

- name: "Intercom door - Stop and disable legacy button service"
  ansible.builtin.systemd:
    name: intercom-door-button.service
    state: stopped
    enabled: false
    daemon_reload: true
  failed_when: false

- name: "Intercom door - Remove legacy button files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/intercom-door-button.service
    - /opt/intercom/doorpi0-button.py
  notify: Restart intercom door

- name: "Intercom door - Stop and disable legacy camera service"
  ansible.builtin.systemd:
    name: intercom-cam.service
    state: stopped
    enabled: false
    daemon_reload: true
  failed_when: false

- name: "Intercom door - Remove legacy camera unit"
  ansible.builtin.file:
    path: /etc/systemd/system/intercom-cam.service
    state: absent

- name: "Intercom door - Enable and start"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - intercom-door.service
    - intercom-audio-rx.service
    - intercom-cam-video.service
    - intercom-cam-audio.service
    - mediamtx.service

- name: "Intercom door - Enable and start mic volume user service"
  ansible.builtin.command: >
    systemctl --user -M {{ intercom_pipewire_user }}@.host
    enable --now set-mic-volume.service
  changed_when: false
