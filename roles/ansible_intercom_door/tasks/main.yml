---
- name: "Intercom door - Validate credentials"
  ansible.builtin.assert:
    that:
      - intercom_mqtt_password | length > 0
    fail_msg: "intercom_mqtt_password fehlt (vaulted in host_vars eintragen)."

- name: "Intercom door - Install packages"
  ansible.builtin.apt:
    name: "{{ intercom_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Intercom door - Ensure directory"
  ansible.builtin.file:
    path: /opt/intercom
    state: directory
    mode: "0755"

- name: "Intercom door - Render daemon"
  ansible.builtin.template:
    src: intercom-door.py.j2
    dest: /opt/intercom/intercom-door.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart intercom door

- name: "Intercom door - systemd unit (daemon)"
  ansible.builtin.template:
    src: intercom-door.service.j2
    dest: /etc/systemd/system/intercom-door.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart intercom door

- name: "Intercom door - systemd unit (audio receiver)"
  ansible.builtin.template:
    src: intercom-audio-rx.service.j2
    dest: /etc/systemd/system/intercom-audio-rx.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart intercom audio receiver

- name: "Intercom door - Stop and disable legacy button service"
  ansible.builtin.systemd:
    name: intercom-door-button.service
    state: stopped
    enabled: false
    daemon_reload: true
  failed_when: false

- name: "Intercom door - Remove legacy button files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/intercom-door-button.service
    - /opt/intercom/doorpi0-button.py
  notify: Restart intercom door

- name: "Intercom door - Enable and start"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - intercom-door.service
    - intercom-audio-rx.service
