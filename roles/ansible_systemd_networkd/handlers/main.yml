---
# handlers for ansible_systemd_networkd

- name: restart systemd-networkd
  become: true
  service:
    name: systemd-networkd
    state: restarted
  when: systemd_networkd_apply_config

- name: daemon-reload and enable wg refresh
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start wg-endpoint-refresh services
  become: true
  ansible.builtin.systemd:
    name: "wg-endpoint-refresh-{{ item.iface }}"
    enabled: true
    state: started
  loop: "{{ _wg_refresh_interfaces | default([]) }}"
  loop_control:
    label: "{{ item.iface }}"

- name: daemon-reload and enable wg watch
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable wg-endpoint-watch timers
  become: true
  ansible.builtin.systemd:
    name: "wg-endpoint-watch-{{ item.iface }}.timer"
    enabled: true
    state: started
  loop: "{{ _wg_refresh_interfaces | default([]) }}"
  loop_control:
    label: "{{ item.iface }}"
