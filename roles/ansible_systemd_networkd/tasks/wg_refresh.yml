---
# Detects WireGuard interfaces that use a hostname in their Endpoint and deploys:
# 1. A oneshot boot service that waits for DNS, then reconfigures the interface
# 2. A periodic watcher script + timer that detects endpoint IP changes and
#    reconfigures the interface without restart (no tunnel flap)
#
# This fixes two problems:
# - Race condition at boot: WG interface comes up before DNS is available
# - Dynamic endpoint: server IP changes, DNS updates, but networkd keeps
#   sending to the old cached IP forever

- name: "MMN systemd-networkd - Extract WireGuard interfaces with hostname endpoints"
  ansible.builtin.set_fact:
    _wg_refresh_interfaces: >-
      {%- set ns = namespace(ifs=[]) -%}
      {%- for _iface, _sections in systemd_networkd_netdev.items() -%}
        {%- for _section in _sections -%}
          {%- for _stype, _opts in _section.items() -%}
            {%- if _stype == 'WireGuardPeer' -%}
              {%- for _opt in _opts -%}
                {%- if _opt.Endpoint is defined -%}
                  {%- set _ep = _opt.Endpoint | split(':') | first -%}
                  {%- if _ep | regex_search('^[0-9a-fA-F:]+$') is none -%}
                    {%- set ns.ifs = ns.ifs + [{'iface': _iface, 'endpoint': _opt.Endpoint}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.ifs }}
  when:
    - systemd_networkd_wireguard_refresh | bool
    - systemd_networkd_netdev | length > 0

- name: "MMN systemd-networkd - Deploy WireGuard endpoint refresh boot service"
  ansible.builtin.template:
    src: wg-endpoint-refresh.service.j2
    dest: "/etc/systemd/system/wg-endpoint-refresh-{{ item.iface }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _wg_refresh_interfaces | default([]) }}"
  loop_control:
    label: "{{ item.iface }}"
  notify: daemon-reload and enable wg refresh
  when:
    - systemd_networkd_wireguard_refresh | bool
    - _wg_refresh_interfaces | default([]) | length > 0

- name: "MMN systemd-networkd - Deploy WireGuard endpoint watch script"
  ansible.builtin.template:
    src: wg-endpoint-watch.sh.j2
    dest: "/usr/local/sbin/wg-endpoint-watch-{{ item.iface }}.sh"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ _wg_refresh_interfaces | default([]) }}"
  loop_control:
    label: "{{ item.iface }}"
  when:
    - systemd_networkd_wireguard_refresh | bool
    - _wg_refresh_interfaces | default([]) | length > 0

- name: "MMN systemd-networkd - Deploy WireGuard endpoint watch service"
  ansible.builtin.template:
    src: wg-endpoint-watch.service.j2
    dest: "/etc/systemd/system/wg-endpoint-watch-{{ item.iface }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _wg_refresh_interfaces | default([]) }}"
  loop_control:
    label: "{{ item.iface }}"
  notify:
    - daemon-reload and enable wg watch
    - Enable wg-endpoint-watch timers
  when:
    - systemd_networkd_wireguard_refresh | bool
    - _wg_refresh_interfaces | default([]) | length > 0

- name: "MMN systemd-networkd - Deploy WireGuard endpoint watch timer"
  ansible.builtin.template:
    src: wg-endpoint-watch.timer.j2
    dest: "/etc/systemd/system/wg-endpoint-watch-{{ item.iface }}.timer"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _wg_refresh_interfaces | default([]) }}"
  loop_control:
    label: "{{ item.iface }}"
  notify:
    - daemon-reload and enable wg watch
    - Enable wg-endpoint-watch timers
  when:
    - systemd_networkd_wireguard_refresh | bool
    - _wg_refresh_interfaces | default([]) | length > 0
