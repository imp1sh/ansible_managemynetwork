---
# Detects WireGuard interfaces that use a hostname in their Endpoint and deploys
# a oneshot systemd service that waits for DNS to become available after boot,
# then reconfigures the interface so networkd re-resolves the endpoint.
#
# This fixes the race condition where rw0 comes up before ens3 has DNS, causing
# networkd to permanently cache a failed DNS lookup for the WG endpoint.

- name: "MMN systemd-networkd - Extract WireGuard interfaces with hostname endpoints"
  ansible.builtin.set_fact:
    _wg_refresh_interfaces: >-
      {%- set ns = namespace(ifs=[]) -%}
      {%- for _iface, _sections in systemd_networkd_netdev.items() -%}
        {%- for _section in _sections -%}
          {%- for _stype, _opts in _section.items() -%}
            {%- if _stype == 'WireGuardPeer' -%}
              {%- for _opt in _opts -%}
                {%- if _opt.Endpoint is defined -%}
                  {%- set _ep = _opt.Endpoint | split(':') | first -%}
                  {%- if _ep | regex_search('^[0-9a-fA-F:]+$') is none -%}
                    {%- set ns.ifs = ns.ifs + [{'iface': _iface, 'endpoint': _opt.Endpoint}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.ifs }}
  when:
    - systemd_networkd_wireguard_refresh | bool
    - systemd_networkd_netdev | length > 0

- name: "MMN systemd-networkd - Deploy WireGuard endpoint refresh service"
  ansible.builtin.template:
    src: wg-endpoint-refresh.service.j2
    dest: "/etc/systemd/system/wg-endpoint-refresh-{{ item.iface }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _wg_refresh_interfaces | default([]) }}"
  loop_control:
    label: "{{ item.iface }}"
  notify: daemon-reload and enable wg refresh
  when:
    - systemd_networkd_wireguard_refresh | bool
    - _wg_refresh_interfaces | default([]) | length > 0

- name: "MMN systemd-networkd - Remove stale WireGuard endpoint refresh services"
  ansible.builtin.file:
    path: "/etc/systemd/system/wg-endpoint-refresh-{{ item }}.service"
    state: absent
  loop: "{{ _wg_refresh_stale | default([]) }}"
  notify: daemon-reload
  when: _wg_refresh_stale | default([]) | length > 0
