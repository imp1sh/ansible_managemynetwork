---
# Notify logged-in users and wait a grace period before rebooting.
# Sends wall messages to all TTYs and notify-send to graphical sessions.
#
# We deliberately AVOID `shutdown -r +N`: although it broadcasts wall
# messages natively, it also creates /run/nologin immediately for delays
# <= 5 min. That blocks the SSH connections Ansible needs to proceed,
# causing UNREACHABLE failures during the grace window or on reruns.
# Using `wall` gives the same TTY broadcast without poisoning logins.

- name: "MMN Patchday - Cancel any lingering scheduled shutdown"
  ansible.builtin.command: shutdown -c
  changed_when: false
  failed_when: false

- name: "MMN Patchday - Broadcast initial wall warning"
  ansible.builtin.command: >
    wall "System reboot after patchday updates in {{ patchday_reboot_grace_period }} seconds. Save your work NOW."
  changed_when: true
  when:
    - patchday_reboot_notify | bool
    - patchday_reboot_grace_period | int > 0

- name: "MMN Patchday - Send sway notification to all graphical users"
  ansible.builtin.shell: |
    for sock in /run/user/*/wayland-*; do
      uid=$(basename $(dirname "$sock") | sed 's/.*-//')
      username=$(getent passwd "$uid" | cut -d: -f1)
      rundir="/run/user/$uid"
      if [ -n "$username" ]; then
        DISPLAY=:0 WAYLAND_DISPLAY=$(basename "$sock") XDG_RUNTIME_DIR="$rundir" \
          su - "$username" -c "notify-send -u critical -t 0 'SYSTEM REBOOT' 'Rebooting in {{ patchday_reboot_grace_period }} seconds after patchday updates. Save your work NOW.'" 2>/dev/null &
      fi
    done
  changed_when: true
  failed_when: false
  when:
    - patchday_reboot_notify | bool
    - patchday_reboot_grace_period | int > 0

- name: "MMN Patchday - Wait grace period"
  ansible.builtin.pause:
    seconds: "{{ patchday_reboot_grace_period | int }}"
  when:
    - patchday_reboot_notify | bool
    - patchday_reboot_grace_period | int > 0

- name: "MMN Patchday - Broadcast final wall warning"
  ansible.builtin.command: >
    wall "System rebooting NOW after patchday updates."
  changed_when: true
  when:
    - patchday_reboot_notify | bool
    - patchday_reboot_grace_period | int > 0
