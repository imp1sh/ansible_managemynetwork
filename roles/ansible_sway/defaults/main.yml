---
# Configuration location
# Set to true to use user config (~/.config/sway/config)
sway_userconfig: true

# Images
sway_image_lock: "~/.config/sway/wallpaper/Retro-Programmer.jpeg"
sway_image_wallpaper: "~/.config/sway/wallpaper/Retro-Programmer.jpeg"

# Target user(s) for configuration
# - If undefined/null: uses the user Ansible connects as (ansible_user)
# - If a string: configures for that single user
# - If a list: configures for all users in the list
# Example: sway_users: "alice"
# Example: sway_users: ["alice", "bob"]
sway_users: null

# Modifier key (Mod1=Alt, Mod4=Super/Windows key)
sway_key_mod: "Mod4"

# Terminal emulator
sway_terminal: "alacritty"

# Application launcher/menu
sway_menu: "$rofi_cmd -show combi -combi-modes drun#run -modes combi"
sway_command_rofi: "rofi -terminal '$term'"

# Idle
sway_idle_time: 360

# Output configuration
# List of output configurations, each with name and optional settings
sway_outputs: []
# Example:
# sway_outputs:
#   - name: "*"
#     background: "/usr/share/backgrounds/sway/sway_wallpaper.png"
#     mode: "1920x1080"
#     position: "0 0"
#     scale: null
#     transform: null

# Input configuration
# List of input configurations
sway_inputs: []
# Example:
# sway_inputs:
#   - identifier: "*"
#     xkb_layout: "us"
#     xkb_variant: null
#     xkb_options: null
#     xkb_numlock: null
#     xkb_capslock: null
#     repeat_delay: null
#     repeat_rate: null
#     natural_scroll: null
#     scroll_method: null
#     scroll_button: null
#     left_handed: null
#     accel_profile: null
#     pointer_accel: null
#     tap: null
#     tap_button_map: null
#     drag: null
#     drag_lock: null

# Seat configuration
sway_seats: []
# Example:
# sway_seats:
#   - name: "*"
#     fallback: null
#     cursor: null
#     hide_cursor_when_typing: null

# Window configuration
sway_window_border: 2
sway_window_titlebar: true
sway_window_floating_border: 2
sway_window_floating_titlebar: true
sway_window_hide_edge_borders: null
sway_window_hide_edge_borders_smart: null
sway_window_hide_edge_borders_when_only: null

# Window gaps
sway_gaps_inner: 0
sway_gaps_outer: 0
sway_gaps_smart_borders: null
sway_gaps_smart_gaps: null

# Floating windows
sway_floating_modifier: "$mod"
sway_floating_minimum_size: "75 x 50"
sway_floating_maximum_size: "-1 x -1"

# Colors
sway_colors:
  background:   "#1c1c1c"
  statusline:   "#ffffff"
  focused:
    background:   "#ffaa00"
    border:       "#ffaa00"
    child_border: "#ffaa00"
    indicator:    "#1c1c1c"
    separator:    "#1c1c1c"
    statusline:   "#1c1c1c"
    text:         "#1c1c1c"
  workspace:
    border:       "#ffaa00"
    background:   "#ffaa00"
    text:         "#1c1c1c"
  inactive:
    background:           "#2d2d2d"
    statusline:           "#bbbbbb"
    separator:            "#3a3a3a"
    border:               "#2d2d2d"
    child_border:         "#2d2d2d"
    indicator:            "#2d2d2d"
    text:                 "#bbbbbb"
    workspace_border:     "#2d2d2d"
    workspace_background: "#2d2d2d"
    workspace_text:       "#bbbbbb"
  urgent:
    background:           "#e63946"
    statusline:           "#ffffff"
    separator:            "#83343b"
    border:               "#e63946"
    child_border:         "#e63946"
    indicator:            "#ffffff"
    text:                 "#ffffff"
    workspace_border:     "#e63946"
    workspace_background: "#e63946"
    workspace_text:       "#ffffff"
  binding_mode:
    background:              "#e63946"
    binding_mode_statusline: "#ffffff"
    binding_mode_separator:  "#83343b"
    binding_mode_border:     "#e63946"
    binding_mode_indicator:  "#ffffff"
    binding_mode_text:       "#ffffff"

# Font
sway_font: "pango:Monospace 10"

# Workspaces
# List of workspace numbers/names
sway_workspaces: []
# Example:
# sway_workspaces:
#   - number: 1
#     output: null
#   - number: 2
#     output: null
#   - number: "3:mail"
#     output: null

# Keybindings
# List of keybindings, each with keys and command
sway_keybindings: []
# Example:
# sway_keybindings:
#   - keys: "$mod+Return"
#     command: "exec $term"
#   - keys: "$mod+Shift+q"
#     command: "kill"
#   - keys: "$mod+d"
#     command: "exec $menu"

# Mode keybindings
# List of modes with their keybindings
sway_modes: []
# Example:
# sway_modes:
#   - name: "resize"
#     keybindings:
#       - keys: "Left"
#         command: "resize shrink width 10 px or 10 ppt"
#       - keys: "Right"
#         command: "resize grow width 10 px or 10 ppt"

# Bar configuration
sway_bar_enabled: true
sway_bar_id: "bar0"
sway_bar_mode: null
sway_bar_hidden_state: null
sway_bar_modifier: null
sway_bar_position: "bottom"
sway_bar_status_command: null
sway_bar_font: null
sway_bar_wrap_scroll: null
sway_bar_workspace_buttons: null
sway_bar_strip_workspace_numbers: null
sway_bar_binding_mode_indicator: null
sway_bar_separator_symbol: null
sway_bar_tray_output: null
sway_bar_tray_padding: null
sway_bar_swaybar_command: null

# Window attributes (marks, floating, workspace assignment, per-window commands)
# Dictionary mapping mark names to lists of rules.
# Each rule requires "criteria".
#
# Chained commands (joined with "," to retain criteria within for_window):
#   floating:          true|false|"toggle"
#   border:            "none"|"normal"|"csd"|"toggle"|int (int → "pixel <n>")
#   layout:            "default"|"splith"|"splitv"|"stacking"|"tabbed"|"toggle"
#   opacity:           float (e.g. 0.9) or "set|plus|minus <value>"
#   fullscreen:        true|false|"toggle"|"enable global"|"toggle global"
#   sticky:            true|false|"toggle"
#   inhibit_idle:      true|false|"focus"|"fullscreen"|"open"|"none"|"visible"
#                      (true → "open", false → "none")
#   shortcuts_inhibitor: true|false
#   max_render_time:   "off"|int (milliseconds)
#   split:             "v"|"h"|"t"|"vertical"|"horizontal"|"toggle"|"none"
#   urgent:            true|false|"enable"|"disable"|"allow"|"deny"
#   kill:              true
#   title_format:      string (e.g. "%title")
#   resize:            dict or string (see below)
#   move:              dict or string (see below)
#   raw:               string injected as-is (use ";" to reset criteria
#                      for subsequent commands — see sway(5))
#
# Standalone commands (emitted on separate lines with their own criteria):
#   workspace:         int (→ assign workspace number N) or
#                      string (→ assign workspace <name>)
#   output:            string (→ assign output <name>)
#   no_focus:          true (→ no_focus [criteria])
#
# resize as dict:
#   {width: 800, height: 600}                     → resize set width 800 px height 600 px
#   {width: 800}                                  → resize set width 800 px
#   {height: 600}                                 → resize set height 600 px
#   {action: "shrink", axis: "width", amount: 10} → resize shrink width 10 px
#   {action: "grow", axis: "height", amount: 5, unit: "ppt"}
# resize as string: passed through after "resize "
#
# move as dict:
#   {direction: "left", px: 10}                   → move left 10 px
#   {position: "100 200"}                         → move position 100 200
#   {position: [100, 200]}                        → move position 100 200
#   {position: "100 200", absolute: true}        → move absolute position 100 200
#   {center: true}                                → move position center
#   {center: true, absolute: true}                → move absolute position center
#   {cursor: true}                                → move position cursor
#   {to_workspace: 3}                             → move container to workspace number 3
#   {to_workspace: "3:mail"}                      → move container to workspace 3:mail
#   {to_workspace: "next"}                        → move container to workspace next
#   {to_output: "HDMI-1"}                         → move container to output HDMI-1
#   {to_scratchpad: true}                         → move container to scratchpad
#   {to_mark: "somemark"}                         → move container to mark somemark
# move as string: passed through after "move "
sway_window_attributes: {}
# Example:
# sway_window_attributes:
#   Browser:
#     - criteria: 'app_id="org.mozilla.firefox"'
#       workspace: 2
#     - criteria: 'app_id="librewolf"'
#       workspace: 1
#   Filebrowser:
#     - criteria: 'app_id="Thunar"'
#       floating: true
#       border: none
#   Secrets:
#     - criteria: 'app_id="org.gnome.Secrets"'
#       floating: true
#       opacity: 0.95
#   Pinned:
#     - criteria: 'app_id="pinned_app"'
#       sticky: true
#       inhibit_idle: true
#   Killed:
#     - criteria: 'app_id="annoying_popup"'
#       kill: true
#   NoShortcutInhibit:
#     - criteria: 'app_id="vmware"'
#       shortcuts_inhibitor: false
#   RenderTime:
#     - criteria: 'app_id="game"'
#       max_render_time: 1
#   Resized:
#     - criteria: 'app_id="big"'
#       resize: {width: 800, height: 600}
#   Shrunk:
#     - criteria: 'app_id="small"'
#       resize: {action: "shrink", axis: "width", amount: 10}
#   Moved:
#     - criteria: 'app_id="mv"'
#       move: {to_workspace: 5}
#   Positioned:
#     - criteria: 'app_id="pos"'
#       move: {position: [100, 200]}
#   Centered:
#     - criteria: 'app_id="center"'
#       move: {center: true}
#   NoFocusWindow:
#     - criteria: 'app_id="background"'
#       no_focus: true
#   ToOutput:
#     - criteria: 'app_id="external"'
#       output: "HDMI-1"
#   NamedWorkspace:
#     - criteria: 'app_id="mail"'
#       workspace: "3:mail"

# Exec commands (startup applications)
# List of commands to execute on startup
sway_exec_commands: []
# Example:
# sway_exec_commands:
#   - command: "swaybg -i /usr/share/backgrounds/sway/sway_wallpaper.png"
#   - command: "waybar"
#   - command: "mako"

# Focus wrapping
sway_focus_wrapping: null

# Focus on window activation
sway_focus_on_window_activation: null

# Mouse warping
sway_mouse_warping: null

# Popup during fullscreen
sway_popup_during_fullscreen: null

# Workspace auto back and forth
sway_workspace_auto_back_and_forth: null

# Workspace layout
sway_workspace_layout: null

# Default orientation
sway_default_orientation: null

# Force xwayland
sway_force_xwayland: null

# Xwayland disable
sway_xwayland_disable: null

# Include files
# List of additional config files to include
sway_includes: []
# Example:
# sway_includes:
#   - "~/.config/sway/extra_config"

# Cleanup configuration
# Enable cleanup of backup sway config files
sway_cleanup_enable: true

# Age in minutes for backup files to be deleted (default 2880 = 2 days)
sway_cleanup_age_minutes: 2880

# Cleanup timer schedule (first Monday of month at 10:00)
# Using systemd's calendar specification for first Monday of month at 10:00
sway_cleanup_timer_schedule: "Mon *-*-* 10:00:00"
