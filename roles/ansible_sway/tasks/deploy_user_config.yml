---
- name: MMN sway - Get getent data
  ansible.builtin.getent:
    database: passwd

- name: MMN sway - Check if user exists
  ansible.builtin.fail:
    msg: "User {{ target_user }} does not exist on the system"
  when: target_user not in getent_passwd

- name: MMN sway - Get user's home directory
  ansible.builtin.set_fact:
    target_user_home: "{{ getent_passwd[target_user][4] }}"

- name: MMN sway - Ensure systemd user directory exists
  ansible.builtin.file:
    path: "{{ target_user_home }}/.config/systemd/user"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0700'
  when: sway_cleanup_enable | default(true)

- name: MMN sway - Ensure local bin directory exists
  ansible.builtin.file:
    path: "{{ target_user_home }}/.local/bin"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  when: sway_cleanup_enable | default(true)

- name: MMN sway - Ensure configuration directory exists for {{ target_user }}
  ansible.builtin.file:
    path: "{{ target_user_home }}/.config/sway"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'

- name: MMN sway - Ensure wallpaper directory exists
  ansible.builtin.file:
    path: "{{ target_user_home }}/.config/sway/wallpaper"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'

- name: MMN sway - Check if wallpaper already exists
  ansible.builtin.stat:
    path: "{{ target_user_home }}/.config/sway/wallpaper/Retro-Programmer.jpeg"
  register: wallpaper_stat

- name: MMN sway - Deploy default wallpaper
  ansible.builtin.copy:
    src: "Retro-Programmer.jpeg"
    dest: "{{ target_user_home }}/.config/sway/wallpaper/Retro-Programmer.jpeg"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  when: not wallpaper_stat.stat.exists

- name: MMN sway - Deploy sway configuration file for {{ target_user }}
  ansible.builtin.template:
    src: "{{ sway_filetemplate }}"
    dest: "{{ target_user_home }}/.config/sway/{{ sway_fileconfig }}"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
    backup: yes

- name: MMN sway - Ensure cleanup script exists
  ansible.builtin.copy:
    src: "sway_cleanup.sh"
    dest: "{{ target_user_home }}/.local/bin/sway_cleanup.sh"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  when: sway_cleanup_enable | default(true)

- name: MMN sway - Create systemd user timer for sway cleanup
  ansible.builtin.template:
    src: "sway_cleanup.timer.j2"
    dest: "{{ target_user_home }}/.config/systemd/user/sway_cleanup.timer"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  when: sway_cleanup_enable | default(true)

- name: MMN sway - Create systemd user service for sway cleanup
  ansible.builtin.template:
    src: "sway_cleanup.service.j2"
    dest: "{{ target_user_home }}/.config/systemd/user/sway_cleanup.service"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  when: sway_cleanup_enable | default(true)

- name: MMN sway - Enable linger for {{ target_user }}
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ target_user }}"
  when: sway_cleanup_enable | default(true)
  changed_when: false

- name: MMN sway - Reload systemd user daemon for {{ target_user }}
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ target_user }}"
  when: sway_cleanup_enable | default(true)

- name: MMN sway - Enable and start sway cleanup timer for {{ target_user }}
  ansible.builtin.systemd:
    name: sway_cleanup.timer
    enabled: true
    state: started
    scope: user
  become: true
  become_user: "{{ target_user }}"
  when: sway_cleanup_enable | default(true)
