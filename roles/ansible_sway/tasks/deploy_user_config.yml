---
- name: MMN sway - Get getent data
  ansible.builtin.getent:
    database: passwd

- name: MMN sway - Check if user exists
  ansible.builtin.fail:
    msg: "User {{ target_user }} does not exist on the system"
  when: target_user not in getent_passwd

- name: MMN sway - Get user's home directory
  ansible.builtin.set_fact:
    target_user_home: "{{ getent_passwd[target_user][4] }}"

- name: MMN sway - Ensure configuration directory exists for {{ target_user }}
  ansible.builtin.file:
    path: "{{ target_user_home }}/.config/sway"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'

- name: MMN sway - Ensure wallpaper directory exists
  ansible.builtin.file:
    path: "{{ target_user_home }}/.config/sway/wallpaper"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'

- name: MMN sway - Check if wallpaper already exists
  ansible.builtin.stat:
    path: "{{ target_user_home }}/.config/sway/wallpaper/Retro-Programmer.jpeg"
  register: wallpaper_stat

- name: MMN sway - Deploy default wallpaper
  ansible.builtin.copy:
    src: "Retro-Programmer.jpeg"
    dest: "{{ target_user_home }}/.config/sway/wallpaper/Retro-Programmer.jpeg"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  when: not wallpaper_stat.stat.exists

- name: MMN sway - Check if sway config already exists
  ansible.builtin.stat:
    path: "{{ target_user_home }}/.config/sway/{{ sway_fileconfig }}"
  register: config_stat

- name: MMN sway - Backup existing sway config if it exists
  ansible.builtin.copy:
    src: "{{ target_user_home }}/.config/sway/{{ sway_fileconfig }}"
    dest: "{{ target_user_home }}/.config/sway/{{ sway_fileconfig }}.backup.{{ ansible_date_time.epoch }}"
    remote_src: yes
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
  when: config_stat.stat.exists

- name: MMN sway - Deploy sway configuration file for {{ target_user }}
  ansible.builtin.template:
    src: "{{ sway_filetemplate }}"
    dest: "{{ target_user_home }}/.config/sway/{{ sway_fileconfig }}"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
    backup: yes



# User not on host
- name: MMN sway - Fail if user {{ target_user }} does not exist
  ansible.builtin.fail:
    msg: "User {{ target_user }} does not exist on the system"
  when: target_user not in getent_passwd
