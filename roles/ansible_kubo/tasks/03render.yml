---
# Phase 3 — per instance: read the existing config (to preserve the
# Identity section generated by init), build the full config dict with
# per-instance overrides and auto-discovered Peering, deep-merge, and
# render. Restarts the container if config changed and the service is
# running.

- name: "MMN kubo - Read existing config for {{ kubo_instance.name }}"
  ansible.builtin.slurp:
    src: "{{ kubo_instance.data_dir }}/config"
  register: _kubo_existing_config_raw

- name: "MMN kubo - Extract Identity from existing config"
  ansible.builtin.set_fact:
    _kubo_identity: >-
      {{
        (_kubo_existing_config_raw.content | b64decode | from_json).Identity
      }}

- name: "MMN kubo - Build Peering list (all peers except self)"
  ansible.builtin.set_fact:
    _kubo_peering_peers: >-
      {%- set peers = [] -%}
      {%- for pid in _kubo_peer_ids -%}
        {%- if pid != _kubo_identity.PeerID -%}
          {%- set dns = _kubo_peer_map[pid] -%}
          {%- set _ = peers.append({
              'ID': pid,
              'Addrs': [
                '/' ~ ('dns6') ~ '/' ~ dns ~ '/tcp/' ~ (kubo_swarm_port | string) ~ '/p2p/' ~ pid,
                '/' ~ ('dns6') ~ '/' ~ dns ~ '/udp/' ~ (kubo_swarm_port | string) ~ '/quic-v1/p2p/' ~ pid
              ]
            }) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ peers }}

- name: "MMN kubo - Build Swarm addresses for {{ kubo_instance.name }}"
  ansible.builtin.set_fact:
    _kubo_swarm_addrs: >-
      {%- set addrs = kubo_swarm_transports | map('regex_replace', '\\{\\{ kubo_swarm_port \\}\\}', kubo_swarm_port | string) | list -%}
      {%- set _ = addrs.extend([
            '/dns6/' ~ kubo_instance.dns_short ~ '/tcp/' ~ (kubo_swarm_port | string),
            '/dns6/' ~ kubo_instance.dns_full ~ '/tcp/' ~ (kubo_swarm_port | string)
          ]) -%}
      {{ addrs }}

- name: "MMN kubo - Assemble config for {{ kubo_instance.name }}"
  ansible.builtin.set_fact:
    _kubo_config: >-
      {{
        kubo_config
        | combine({
            'Identity': _kubo_identity,
            'Bootstrap': kubo_bootstrap,
            'Addresses': {
              'Swarm': _kubo_swarm_addrs,
              'NoAnnounce': kubo_no_announce
            },
            'API': {
              'HTTPHeaders': {
                'Access-Control-Allow-Origin': kubo_instance.api_cors_origins | default([])
              }
            },
            'Gateway': {
              'PublicGateways': {
                kubo_instance.gateway_domain: {
                  'Paths': ['/ipfs', '/ipns'],
                  'NoDNSLink': false,
                  'UseSubdomains': false
                }
              }
            },
            'Peering': {
              'Peers': _kubo_peering_peers,
              'StrictPeers': kubo_peering_strict
            },
            'Routing': {
              'Type': kubo_routing_type
            },
            'Discovery': {
              'MDNS': {
                'Enabled': kubo_mdns_enabled
              }
            },
            'Swarm': {
              'AddrFilters': kubo_no_announce,
              'DisableNatPortMap': kubo_disable_nat_port_map
            },
            'Datastore': {
              'StorageMax': kubo_storage_max,
              'StorageGCWatermark': kubo_storage_gc_watermark,
              'GCPeriod': kubo_gc_period
            }
          }, recursive=True)
        | combine(kubo_config_extra, recursive=True)
      }}

- name: "MMN kubo - Render config for {{ kubo_instance.name }}"
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ kubo_instance.data_dir }}/config"
    owner: "{{ kubo_owner }}"
    group: "{{ kubo_group }}"
    mode: "0600"
  register: _kubo_config_rendered

- name: "MMN kubo - Check if container service is active"
  ansible.builtin.command:
    cmd: "systemctl is-active {{ kubo_systemd_prefix }}{{ kubo_instance.name }}.service"
  register: _kubo_active
  changed_when: false
  failed_when: false

- name: "MMN kubo - Restart container if config changed"
  ansible.builtin.systemd:
    name: "{{ kubo_systemd_prefix }}{{ kubo_instance.name }}.service"
    state: restarted
  when:
    - _kubo_config_rendered.changed
    - _kubo_active.rc == 0
