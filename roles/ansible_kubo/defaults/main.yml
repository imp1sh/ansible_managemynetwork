---
# ansible_kubo — container-only role.
#
# Bootstraps Kubo (IPFS) nodes from scratch: initialises the IPFS repo
# (generating a cryptographic identity), auto-discovers peer IDs for
# Peering, and renders the full config. Designed as a pre-creation plugin of
# the ansible_podman role — config and repo are in place before the container
# starts for the first time.

# ---------------------------------------------------------------------------
# Container image (used for the throwaway init container). Must match the
# image in the podman container definition.
# ---------------------------------------------------------------------------
kubo_image: "docker.io/ipfs/kubo:v0.43.0"

# ---------------------------------------------------------------------------
# Instances — one dict per Kubo node. REQUIRED.
#
#   kubo_instances:
#     - name: ipfs0                       # container + systemd service name
#       data_dir: /filer0/ipfs/0/data     # host path to the IPFS repo (maps to /data/ipfs)
#       dns_short: ipfs0                   # short DNS name for swarm addresses
#       dns_full: ipfs0.dns.podman         # full DNS name for swarm addresses
#       gateway_domain: ipfs0.lpv4.net    # domain for Gateway.PublicGateways
#       api_cors_origins:                  # CORS origins for the API
#         - "https://ipfs0-api.lpv4.net"
#         - "https://ipfs0.lpv4.net"
# ---------------------------------------------------------------------------
kubo_instances: []

# ---------------------------------------------------------------------------
# Init profile applied during `ipfs init`. "server" disables MDNS and sets
# AddrFilters for private ranges — recommended for servers.
# See: ipfs config profile --help
# ---------------------------------------------------------------------------
kubo_profile: "server"

# ---------------------------------------------------------------------------
# Networking — ports
# ---------------------------------------------------------------------------
kubo_api_port: 5001
kubo_gateway_port: 8080
kubo_swarm_port: 4001

# ---------------------------------------------------------------------------
# Swarm transport addresses. Each entry is appended to the base Swarm list.
# Defaults cover TCP, QUIC v1, WebRTC-direct, and WebTransport.
# ---------------------------------------------------------------------------
kubo_swarm_transports:
  - "/ip4/0.0.0.0/tcp/{{ kubo_swarm_port }}"
  - "/ip6/::/tcp/{{ kubo_swarm_port }}"
  - "/ip4/0.0.0.0/udp/{{ kubo_swarm_port }}/webrtc-direct"
  - "/ip4/0.0.0.0/udp/{{ kubo_swarm_port }}/quic-v1"
  - "/ip4/0.0.0.0/udp/{{ kubo_swarm_port }}/quic-v1/webtransport"
  - "/ip6/::/udp/{{ kubo_swarm_port }}/webrtc-direct"
  - "/ip6/::/udp/{{ kubo_swarm_port }}/quic-v1"
  - "/ip6/::/udp/{{ kubo_swarm_port }}/quic-v1/webtransport"

# ---------------------------------------------------------------------------
# Peering — whether to enforce strict peering (only connect to configured
# peers, refuse random swarm connections).
# ---------------------------------------------------------------------------
kubo_peering_strict: true

# ---------------------------------------------------------------------------
# Routing type. "none" = no DHT (private cluster, relay on Peering only).
# "auto" = full DHT participation (public node).
# ---------------------------------------------------------------------------
kubo_routing_type: "none"

# ---------------------------------------------------------------------------
# Discovery
# ---------------------------------------------------------------------------
kubo_mdns_enabled: false

# ---------------------------------------------------------------------------
# Swarm
# ---------------------------------------------------------------------------
kubo_disable_nat_port_map: true

# Private-range CIDRs excluded from announcement and filtered from swarm
# connections. Matches the upstream "server" profile defaults.
kubo_no_announce:
  - "/ip4/10.0.0.0/ipcidr/8"
  - "/ip4/100.64.0.0/ipcidr/10"
  - "/ip4/169.254.0.0/ipcidr/16"
  - "/ip4/172.16.0.0/ipcidr/12"
  - "/ip4/192.0.0.0/ipcidr/24"
  - "/ip4/192.0.2.0/ipcidr/24"
  - "/ip4/192.168.0.0/ipcidr/16"
  - "/ip4/198.18.0.0/ipcidr/15"
  - "/ip4/198.51.100.0/ipcidr/24"
  - "/ip4/203.0.113.0/ipcidr/24"
  - "/ip4/240.0.0.0/ipcidr/4"
  - "/ip6/100::/ipcidr/64"
  - "/ip6/2001:2::/ipcidr/48"
  - "/ip6/2001:db8::/ipcidr/32"
  - "/ip6/fc00::/ipcidr/7"
  - "/ip6/fe80::/ipcidr/10"

# ---------------------------------------------------------------------------
# Datastore
# ---------------------------------------------------------------------------
kubo_storage_max: "10GB"
kubo_storage_gc_watermark: 90
kubo_gc_period: "1h"

# ---------------------------------------------------------------------------
# Bootstrap nodes (default: none — private cluster relies on Peering)
# ---------------------------------------------------------------------------
kubo_bootstrap: []

# ---------------------------------------------------------------------------
# File ownership — must match the container process user.
# The official kubo image runs as uid=1000(ipfs) gid=100(users).
# Specify as numeric UID/GID to avoid name-resolution mismatches between
# host and container.
# ---------------------------------------------------------------------------
kubo_owner: 1000
kubo_group: 100

# ---------------------------------------------------------------------------
# Systemd — service name prefix. Empty for Quadlet; "container-" for legacy.
# ---------------------------------------------------------------------------
kubo_systemd_prefix: ""

# ---------------------------------------------------------------------------
# Advanced — override any key in the rendered config without touching the
# full config dict below. Merged recursively on top of everything else.
# ---------------------------------------------------------------------------
kubo_config_extra: {}

# ---------------------------------------------------------------------------
# Base config dict. Contains ALL sections with upstream defaults. Per-instance
# values (Addresses, API CORS, Gateway, Peering, Identity) are injected by the
# role tasks at render time. Override individual keys via kubo_config_extra or
# by overriding this var entirely.
# ---------------------------------------------------------------------------
kubo_config:
  API:
    HTTPHeaders:
      Access-Control-Allow-Credentials:
        - "true"
      Access-Control-Allow-Methods:
        - "PUT"
        - "POST"
        - "GET"
      Access-Control-Allow-Origin: []
  Addresses:
    API:
      - "/ip4/0.0.0.0/tcp/5001"
      - "/ip6/::/tcp/5001"
    Announce: []
    AppendAnnounce: []
    Gateway:
      - "/ip4/0.0.0.0/tcp/8080"
      - "/ip6/::/tcp/8080"
    NoAnnounce: []
    Swarm: []
  AutoConf: {}
  AutoNAT: {}
  AutoTLS: {}
  Bitswap: {}
  Bootstrap: []
  DNS:
    Resolvers:
      ".": "auto"
  Datastore:
    BlockKeyCacheSize: null
    BloomFilterSize: 0
    GCPeriod: "1h"
    HashOnRead: false
    Spec:
      mounts:
        - mountpoint: "/blocks"
          path: "blocks"
          prefix: "flatfs.datastore"
          shardFunc: "/repo/flatfs/shard/v1/next-to-last/2"
          sync: false
          type: "flatfs"
        - compression: "none"
          mountpoint: "/"
          path: "datastore"
          prefix: "leveldb.datastore"
          type: "levelds"
      type: "mount"
    StorageGCWatermark: 90
    StorageMax: "10GB"
  Discovery:
    MDNS:
      Enabled: false
  Experimental:
    FilestoreEnabled: false
    Libp2pStreamMounting: false
    OptimisticProvide: false
    OptimisticProvideJobsPoolSize: 0
    P2pHttpProxy: false
    UrlstoreEnabled: false
  Gateway:
    DeserializedResponses: null
    DisableHTMLErrors: null
    ExposeRoutingAPI: null
    HTTPHeaders: {}
    NoDNSLink: false
    NoFetch: false
    PublicGateways: {}
    RootRedirect: ""
  HTTPRetrieval: {}
  Import:
    BatchMaxNodes: null
    BatchMaxSize: null
    CidVersion: null
    HashFunction: null
    UnixFSChunker: null
    UnixFSDirectoryMaxLinks: null
    UnixFSFileMaxLinks: null
    UnixFSHAMTDirectoryMaxFanout: null
    UnixFSHAMTDirectorySizeThreshold: null
    UnixFSRawLeaves: null
  Internal: {}
  Ipns:
    DelegatedPublishers:
      - "auto"
    RecordLifetime: ""
    RepublishPeriod: ""
    ResolveCacheSize: 128
  Migration: {}
  Mounts:
    FuseAllowOther: false
    IPFS: "/ipfs"
    IPNS: "/ipns"
    MFS: "/mfs"
  Peering:
    Peers: []
    StrictPeers: true
  Pinning:
    RemoteServices: {}
  Plugins:
    Plugins: null
  Provide:
    DHT: {}
  Provider: {}
  Pubsub:
    DisableSigning: false
    Router: ""
  Reprovider: {}
  Routing:
    Type: "none"
  Swarm:
    AddrFilters: []
    Connmgr: {}
    DisableBandwidthMetrics: false
    DisableNatPortMap: true
    RelayClient: {}
    RelayService: {}
    ResourceMgr: {}
    Transports:
      Multiplexers: {}
      Network: {}
      Security: {}
  Version: {}
