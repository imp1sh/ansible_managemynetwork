---
- name: "MMN users - Block when system_users is defined for host"
  block:
    - name: "MMN users - Determine target host for delegation"
      ansible.builtin.set_fact:
        _users_target_host: "{{ openwrt_imagebuilder_buildhost if (openwrt_imagebuilder_buildhost is defined and openwrt_imagebuilder_buildhost != inventory_hostname) else inventory_hostname }}"

    - name: "MMN users - Setting OS variables"
      ansible.builtin.include_vars: "{{ role_path }}/vars/OpenWrt.yml"

    - name: "MMN users - Set additoinal packages for installrole var"
      ansible.builtin.set_fact:
        packages_installrole: "{{ system_users_additional_packages | default([]) }}"

    - name: "MMN users - Call packages role"
      ansible.builtin.include_role:
        name: imp1sh.ansible_managemynetwork.ansible_packages

    - name: "MMN users - Select and deploy users"
      ansible.builtin.include_tasks: select_and_deploy.yml
      vars:
        users_runner: "03imagebuilder_runusers.yml"
  when: system_users is defined

- name: "MMN users - Fail status feedback"
  ansible.builtin.debug:
    msg: "The role system_users did not run on host {{ inventory_hostname }} because the var system_users is not set."
  when: system_users is not defined
