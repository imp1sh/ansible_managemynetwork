---
- name: MMN groups - Setting OS variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
        - "default.yml"
      paths:
        - "vars"

- name: "MMN groups - Install packages block"
  block:
    - name: "MMN groups - Set additional packages for installrole var"
      ansible.builtin.set_fact:
        packages_installrole: "{{ system_groups_additional_packages | default([]) }}"
    - name: "MMN groups - Call packages role"
      ansible.builtin.include_role:
        name: imp1sh.ansible_managemynetwork.ansible_packages
  when: ansible_facts['os_family'] == "OpenWrt"

- name: MMN groups - Select and deploy groups
  ansible.builtin.include_tasks: select_and_deploy.yml
  vars:
    groups_runner: "02live_iterategroups.yml"
  when: system_groups is defined

- name: MMN groups - Fail status feedback
  ansible.builtin.debug:
    msg: "The role system_groups did not run on host {{ inventory_hostname }} because the var system_groups is not set."
  when: system_groups is not defined
