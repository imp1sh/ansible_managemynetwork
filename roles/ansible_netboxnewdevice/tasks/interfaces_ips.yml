---
# Interactively select interfaces one at a time, create them in NetBox
# with their IP addresses, then select primary IPs. Runs after the
# device has been created or confirmed.

- name: "MMN NND - Set device ID for interface creation"
  ansible.builtin.set_fact:
    nnd_target_device_id: "{{ nnd_existing_device_id if (nnd_device_exists | default(false)) else nnd_created_device_id }}"

- name: "MMN NND - Set device name for interface creation"
  ansible.builtin.set_fact:
    nnd_target_device_name: "{{ device_name_final }}"

- name: "MMN NND - Build interface list excluding loopback"
  ansible.builtin.set_fact:
    nnd_physical_interfaces: "{{ ansible_interfaces | reject('match', '^lo') | reject('match', '^lo:') | list }}"
  when:
    - ansible_interfaces is defined
    - mmn_netbox_create_interfaces | default(true) | bool

- name: "MMN NND - Normalize interface facts for each interface"
  ansible.builtin.set_fact:
    nnd_normalized_interfaces: "{{ nnd_normalized_interfaces | default([]) + [_normalized] }}"
  loop: "{{ nnd_physical_interfaces }}"
  loop_control:
    loop_var: nnd_iface_item
    label: "{{ nnd_iface_item }}"
  when:
    - nnd_physical_interfaces is defined
    - nnd_physical_interfaces | length > 0
    - mmn_netbox_create_interfaces | default(true) | bool
  vars:
    nnd_safe_name: "{{ nnd_iface_item | regex_replace('[^a-zA-Z0-9]', '_') }}"
    nnd_raw_facts: "{{ lookup('vars', 'ansible_' ~ nnd_safe_name, default={}) }}"
    nnd_iface_type: >-
      {{
        'virtual' if (nnd_raw_facts.type | default('')) in ['bridge', 'loopback']
        else ('1000base-t' if (nnd_raw_facts.type | default('')) == 'ether'
        else 'other')
      }}
    nnd_raw_ipv4: "{{ nnd_raw_facts.ipv4 | default(none) }}"
    nnd_raw_ipv6: "{{ nnd_raw_facts.ipv6 | default(none) }}"
    nnd_norm_ipv4: "{{ [nnd_raw_ipv4] if (nnd_raw_ipv4 is mapping) else (nnd_raw_ipv4 if (nnd_raw_ipv4 is iterable and nnd_raw_ipv4 is not string and nnd_raw_ipv4 is not none) else []) }}"
    nnd_norm_ipv6: "{{ [nnd_raw_ipv6] if (nnd_raw_ipv6 is mapping) else (nnd_raw_ipv6 if (nnd_raw_ipv6 is iterable and nnd_raw_ipv6 is not string and nnd_raw_ipv6 is not none) else []) }}"
    _normalized:
      name: "{{ nnd_iface_item }}"
      type: "{{ nnd_iface_type }}"
      mac_address: "{{ nnd_raw_facts.macaddress | default(omit) }}"
      mtu: "{{ nnd_raw_facts.mtu | default(omit) }}"
      enabled: "{{ nnd_raw_facts.active | default(true) }}"
      ipv4_list: "{{ nnd_norm_ipv4 }}"
      ipv6_list: "{{ nnd_norm_ipv6 }}"

- name: "MMN NND - No interfaces available"
  ansible.builtin.debug:
    msg: "No interfaces found on this device. Skipping interface and IP creation."
  when:
    - nnd_normalized_interfaces is not defined or nnd_normalized_interfaces | length == 0

- name: "MMN NND - Initialize remaining interfaces and selected IP lists"
  ansible.builtin.set_fact:
    nnd_remaining_interfaces: "{{ nnd_normalized_interfaces }}"
    nnd_selected_ipv4: []
    nnd_selected_ipv6: []
  when:
    - nnd_normalized_interfaces is defined
    - nnd_normalized_interfaces | length > 0

- name: "MMN NND - Process interfaces one at a time"
  ansible.builtin.include_tasks: process_next_interface.yml
  when:
    - nnd_remaining_interfaces is defined
    - nnd_remaining_interfaces | length > 0

- name: "MMN NND - Summary of interface and IP creation"
  ansible.builtin.debug:
    msg:
      - "============================================"
      - "Interface and IP assignment summary"
      - "============================================"
      - "IPv4 addresses assigned: {{ nnd_selected_ipv4 | default([]) | length }}"
      - "IPv6 addresses assigned: {{ nnd_selected_ipv6 | default([]) | length }}"
      - "============================================"
  when:
    - nnd_selected_ipv4 is defined or nnd_selected_ipv6 is defined

- name: "MMN NND - Build numbered list of created IPv4 addresses for primary IP selection"
  ansible.builtin.set_fact:
    nnd_v4_primary_display: "{{ nnd_v4_primary_display | default([]) + [_line] }}"
  loop: "{{ nnd_selected_ipv4 | default([]) }}"
  loop_control:
    loop_var: nnd_v4_prim
    index_var: nnd_v4_pi
  vars:
    _line: "  [{{ nnd_v4_pi }}] {{ nnd_v4_prim.addr.address }}/{{ nnd_v4_prim.addr.prefix | default('?') }} ({{ nnd_v4_prim.iface }})"
  when:
    - nnd_selected_ipv4 is defined
    - nnd_selected_ipv4 | length > 0

- name: "MMN NND - Show IPv4 addresses for primary IP selection"
  ansible.builtin.debug:
    msg: "{{ nnd_v4_primary_display }}"
  when:
    - nnd_v4_primary_display is defined
    - nnd_v4_primary_display | length > 0

- name: "MMN NND - Prompt for primary IPv4"
  ansible.builtin.pause:
    prompt: "Select the primary IPv4 address index for this device (Enter to skip):"
  register: nnd_v4_primary_input
  run_once: true
  when:
    - nnd_v4_primary_display is defined
    - nnd_v4_primary_display | length > 0

- name: "MMN NND - Compute IPv4 CIDR for primary IP query"
  ansible.builtin.set_fact:
    nnd_v4_primary_cidr: "{{ nnd_selected_ipv4[nnd_v4_primary_input.user_input | int].addr.address }}/{{ nnd_selected_ipv4[nnd_v4_primary_input.user_input | int].addr.prefix | default(((nnd_selected_ipv4[nnd_v4_primary_input.user_input | int].addr.netmask | default('255.255.255.255')) | ansible.utils.ipaddr('prefix'))) }}"
  when:
    - nnd_v4_primary_display is defined
    - nnd_v4_primary_display | length > 0
    - nnd_v4_primary_input.user_input | default('') | length > 0

- name: "MMN NND - Query IPv4 address ID from NetBox for primary IP"
  ansible.builtin.set_fact:
    nnd_v4_primary_raw: "{{ query('netbox.netbox.nb_lookup', 'ip-addresses', api_filter='device_id=' ~ (nnd_created_device_id | default(nnd_existing_device_id)) ~ ' address=' ~ nnd_v4_primary_cidr, api_endpoint=mmn_netbox_url, token=mmn_netbox_token) }}"
  when:
    - nnd_v4_primary_cidr is defined

- name: "MMN NND - Debug primary IPv4 query result"
  ansible.builtin.debug:
    msg: "CIDR={{ nnd_v4_primary_cidr }} results={{ nnd_v4_primary_raw | default([]) | length }} ids={{ nnd_v4_primary_raw | default([]) | map(attribute='value.id') | list }}"
  when:
    - nnd_v4_primary_cidr is defined

- name: "MMN NND - Set primary IPv4 on device in NetBox"
  ansible.builtin.uri:
    url: "{{ mmn_netbox_url }}/api/dcim/devices/{{ nnd_created_device_id | default(nnd_existing_device_id) }}/"
    method: PATCH
    headers:
      Authorization: "Token {{ mmn_netbox_token }}"
      Content-Type: application/json
    body_format: json
    body:
      primary_ip4: "{{ (nnd_v4_primary_raw | first).value.id | int }}"
    status_code: 200
  delegate_to: localhost
  become: false
  when:
    - nnd_v4_primary_cidr is defined
    - nnd_v4_primary_raw | default([]) | length > 0

- name: "MMN NND - Build numbered list of created IPv6 addresses for primary IP selection"
  ansible.builtin.set_fact:
    nnd_v6_primary_display: "{{ nnd_v6_primary_display | default([]) + [_line] }}"
  loop: "{{ nnd_selected_ipv6 | default([]) }}"
  loop_control:
    loop_var: nnd_v6_prim
    index_var: nnd_v6_pi
  vars:
    _line: "  [{{ nnd_v6_pi }}] {{ nnd_v6_prim.addr.address }}/{{ nnd_v6_prim.addr.prefix | default('?') }} ({{ nnd_v6_prim.iface }})"
  when:
    - nnd_selected_ipv6 is defined
    - nnd_selected_ipv6 | length > 0

- name: "MMN NND - Show IPv6 addresses for primary IP selection"
  ansible.builtin.debug:
    msg: "{{ nnd_v6_primary_display }}"
  when:
    - nnd_v6_primary_display is defined
    - nnd_v6_primary_display | length > 0

- name: "MMN NND - Prompt for primary IPv6"
  ansible.builtin.pause:
    prompt: "Select the primary IPv6 address index for this device (Enter to skip):"
  register: nnd_v6_primary_input
  run_once: true
  when:
    - nnd_v6_primary_display is defined
    - nnd_v6_primary_display | length > 0

- name: "MMN NND - Compute IPv6 CIDR for primary IP query"
  ansible.builtin.set_fact:
    nnd_v6_primary_cidr: "{{ nnd_selected_ipv6[nnd_v6_primary_input.user_input | int].addr.address }}/{{ nnd_selected_ipv6[nnd_v6_primary_input.user_input | int].addr.prefix | default(64) }}"
  when:
    - nnd_v6_primary_display is defined
    - nnd_v6_primary_display | length > 0
    - nnd_v6_primary_input.user_input | default('') | length > 0

- name: "MMN NND - Query IPv6 address ID from NetBox for primary IP"
  ansible.builtin.set_fact:
    nnd_v6_primary_raw: "{{ query('netbox.netbox.nb_lookup', 'ip-addresses', api_filter='device_id=' ~ (nnd_created_device_id | default(nnd_existing_device_id)) ~ ' address=' ~ nnd_v6_primary_cidr, api_endpoint=mmn_netbox_url, token=mmn_netbox_token) }}"
  when:
    - nnd_v6_primary_cidr is defined

- name: "MMN NND - Debug primary IPv6 query result"
  ansible.builtin.debug:
    msg: "CIDR={{ nnd_v6_primary_cidr }} results={{ nnd_v6_primary_raw | default([]) | length }} ids={{ nnd_v6_primary_raw | default([]) | map(attribute='value.id') | list }}"
  when:
    - nnd_v6_primary_cidr is defined

- name: "MMN NND - Set primary IPv6 on device in NetBox"
  ansible.builtin.uri:
    url: "{{ mmn_netbox_url }}/api/dcim/devices/{{ nnd_created_device_id | default(nnd_existing_device_id) }}/"
    method: PATCH
    headers:
      Authorization: "Token {{ mmn_netbox_token }}"
      Content-Type: application/json
    body_format: json
    body:
      primary_ip6: "{{ (nnd_v6_primary_raw | first).value.id | int }}"
    status_code: 200
  delegate_to: localhost
  become: false
  when:
    - nnd_v6_primary_cidr is defined
    - nnd_v6_primary_raw | default([]) | length > 0
