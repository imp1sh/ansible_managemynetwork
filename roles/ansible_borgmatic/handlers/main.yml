---
# handlers file for ansible_borgmatic
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes
- name: restart borgmatic container
  ansible.builtin.service:
    name: "{{ ('container-' ~ borgmatic_containername) if not (podman_use_quadlet | default(false) | bool) else borgmatic_containername }}"
    state: restarted
