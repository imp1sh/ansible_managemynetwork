---
# Manage Podman containers via Quadlet (.container) systemd units.
#
# This replaces the deprecated `podman generate systemd` path (see 3systemd.yml)
# which baked the container id into a Type=forking PIDFile=, causing a restart
# loop whenever the container was recreated (the unit kept pointing at the old
# id). Quadlet units are declarations of desired state; systemd regenerates the
# transient service correctly on every reload, so recreating a container no
# longer breaks the unit.
#
# Gate: only reached when podman_use_quadlet == true (see defaults/main.yml).
#
# Optimisations vs. the original per-container loop:
#   1. Batch-render all .container unit files in a single template loop.
#   2. Single daemon_reload after all units are rendered.
#   3. Only restart containers whose unit file actually changed.
#   4. Eliminated per-container `podman inspect` and `systemctl is-active`;
#      stray imperative containers are cleaned up in one batch `podman rm -f`
#      guarded by a single `systemctl is-active` check per container that
#      only runs when the unit changed.

- name: "MMN Podman (quadlet) - Ensure Quadlet drop-in directory exists"
  ansible.builtin.file:
    path: "{{ podman_quadlet_dir | default('/etc/containers/systemd') }}"
    state: directory
    mode: '0755'

# ----------------------------------------------------------- batch render units
# Render all present/started .container unit files in one loop. The template
# module registers changed status per-item, so we collect the names of
# containers whose units changed for selective restart below.
- name: "MMN Podman (quadlet) - Render .container unit files"
  ansible.builtin.template:
    src: quadlet.container.j2
    dest: "{{ podman_quadlet_dir | default('/etc/containers/systemd') }}/{{ podman_container.name }}.container"
    mode: '0644'
  loop: "{{ podman_containers | rejectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: podman_container
  register: _quadlet_units
  no_log: true

# Build a list of container names whose unit file changed.
- name: "MMN Podman (quadlet) - Collect changed container names"
  ansible.builtin.set_fact:
    _quadlet_changed: >-
      {{
        _quadlet_units.results
        | selectattr('changed', 'equalto', true)
        | map(attribute='podman_container.name')
        | list
      }}

# Single daemon-reload after all unit files are rendered.
- name: "MMN Podman (quadlet) - Daemon-reload"
  ansible.builtin.systemd:
    daemon_reload: true
  when: _quadlet_changed | length > 0

# ----------------------------------------------- ensure services are enabled/started
# For containers whose unit did NOT change, just ensure the service is in the
# desired state (enabled + started/stopped). No restart needed.
- name: "MMN Podman (quadlet) - Ensure unchanged services are in desired state"
  ansible.builtin.systemd:
    name: "{{ podman_container.name }}"
    state: "{{ 'stopped' if (podman_container.state | default('started')) == 'stopped' else 'started' }}"
    enabled: true
  loop: "{{ podman_containers | rejectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: podman_container
  when: podman_container.name not in _quadlet_changed

# ----------------------------------------------- restart only changed containers
- name: "MMN Podman (quadlet) - Restart changed services"
  ansible.builtin.systemd:
    name: "{{ podman_container.name }}"
    state: restarted
    enabled: true
  loop: "{{ podman_containers | rejectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: podman_container
  when: podman_container.name in _quadlet_changed

# ------------------------------------------------------- stray container cleanup
# Only check for stray imperative containers when a unit changed. If the
# service was already active before the change, the restart handles the
# transition cleanly. If it was inactive (first adoption), remove any stray
# imperative container that would collide with the Quadlet start.
- name: "MMN Podman (quadlet) - Check if stray imperative containers exist"
  ansible.builtin.command: "podman inspect {{ podman_container.name }}"
  register: _quadlet_stray_check
  changed_when: false
  failed_when: false
  loop: "{{ podman_containers | rejectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: podman_container
  when: podman_container.name in _quadlet_changed

- name: "MMN Podman (quadlet) - Remove stray imperative containers (first adoption)"
  ansible.builtin.command: "podman rm -f {{ podman_container.item.name }}"
  loop: "{{ _quadlet_stray_check.results | default([]) }}"
  loop_control:
    loop_var: podman_container
  when:
    - podman_container.rc | default(1) == 0
    - podman_container.item.name in _quadlet_changed
  changed_when: true
  failed_when: false

# ----------------------------------------------------------------------- absent
- name: "MMN Podman (quadlet) - Stop+disable Quadlet service for absent containers"
  ansible.builtin.systemd:
    name: "{{ podman_container.name }}"
    state: stopped
    enabled: false
    daemon_reload: true
  failed_when: false
  loop: "{{ podman_containers | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: podman_container

- name: "MMN Podman (quadlet) - Remove .container unit for absent containers"
  ansible.builtin.file:
    path: "{{ podman_quadlet_dir | default('/etc/containers/systemd') }}/{{ podman_container.name }}.container"
    state: absent
  loop: "{{ podman_containers | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: podman_container

- name: "MMN Podman (quadlet) - Detect legacy units for absent containers"
  ansible.builtin.stat:
    path: "/etc/systemd/system/container-{{ podman_container.name }}.service"
  register: _quadlet_legacy_absent_stats
  loop: "{{ podman_containers | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: podman_container

- name: "MMN Podman (quadlet) - Stop+disable legacy units for absent containers"
  ansible.builtin.systemd:
    name: "container-{{ podman_container.name }}"
    state: stopped
    enabled: false
  failed_when: false
  loop: "{{ podman_containers | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: podman_container
  when: podman_container.name in (_quadlet_legacy_absent_stats.results | selectattr('stat.exists', 'equalto', true) | map(attribute='podman_container.name') | list)

- name: "MMN Podman (quadlet) - Remove legacy unit files for absent containers"
  ansible.builtin.file:
    path: "/etc/systemd/system/container-{{ podman_container.name }}.service"
    state: absent
  loop: "{{ podman_containers | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: podman_container

- name: "MMN Podman (quadlet) - Reset failed states for absent containers"
  ansible.builtin.shell: "systemctl reset-failed {{ podman_container.name }} container-{{ podman_container.name }} || true"
  changed_when: false
  loop: "{{ podman_containers | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: podman_container

- name: "MMN Podman (quadlet) - Remove absent containers"
  ansible.builtin.command: "podman rm -f {{ podman_container.name }}"
  failed_when: false
  changed_when: true
  loop: "{{ podman_containers | selectattr('state', 'equalto', 'absent') | list }}"
  loop_control:
    loop_var: podman_container

- name: "MMN Podman (quadlet) - Daemon-reload after removal"
  ansible.builtin.systemd:
    daemon_reload: true
  when: podman_containers | selectattr('state', 'equalto', 'absent') | list | length > 0
