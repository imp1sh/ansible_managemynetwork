---
# Resolve the container list used for plugin intersection checks. When
# podman_limited_containers is set, only plugins associated with those
# containers run. Otherwise the full list is used.
- name: "MMN Podman - Resolve container list for plugin checks"
  ansible.builtin.set_fact:
    _podman_containers_for_plugins: >-
      {{
        (podman_containers_all | default(podman_containers))
        if podman_limited_containers is not defined
        else (podman_containers_all | default(podman_containers) | rejectattr('state', 'equalto', 'absent') | list | selectattr('name', 'in', podman_limited_containers) | list)
      }}

# PSQL
- name: "MMN Podman - Plugin psql"
  ansible.builtin.include_tasks:
    file: plugin_psql_run1.yml
  when:
    - podman_container_plugin_psql is defined
    - _podman_containers_for_plugins | rejectattr('state', 'equalto', 'absent') | list | map(attribute='name') | intersect(podman_container_plugin_psql) | length > 0

# BORGMATIC
- name: "MMN Podman - Plugin borgmatic"
  ansible.builtin.include_tasks:
    file: plugin_borgmatic.yml
  when:
    - podman_container_plugin_borgmatic is defined
    - podman_containers is defined
    - _podman_containers_for_plugins | rejectattr('state', 'equalto', 'absent') | list | map(attribute='name') | intersect(podman_container_plugin_borgmatic) | length > 0

