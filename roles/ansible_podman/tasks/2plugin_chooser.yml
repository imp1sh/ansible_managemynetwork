---
# Use the full container list (preserved before limiting) for plugin
# intersection checks so config generation always runs regardless of
# podman_limited_containers. Falls back to podman_containers when no
# limiting was applied.
- name: "MMN Podman - Resolve full container list for plugin checks"
  ansible.builtin.set_fact:
    _podman_containers_for_plugins: "{{ podman_containers_all | default(podman_containers) }}"

# PSQL
- name: "MMN Podman - Plugin psql"
  ansible.builtin.include_tasks:
    file: plugin_psql_run1.yml
  when:
    - podman_container_plugin_psql is defined
    - _podman_containers_for_plugins | rejectattr('state', 'equalto', 'absent') | list | map(attribute='name') | intersect(podman_container_plugin_psql) | length > 0

# BORGMATIC
- name: "MMN Podman - Plugin borgmatic"
  ansible.builtin.include_tasks:
    file: plugin_borgmatic.yml
  when:
    - podman_container_plugin_borgmatic is defined
    - podman_containers is defined
    - _podman_containers_for_plugins | rejectattr('state', 'equalto', 'absent') | list | map(attribute='name') | intersect(podman_container_plugin_borgmatic) | length > 0

