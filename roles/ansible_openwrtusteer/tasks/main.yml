---
# tasks file for ansible_openwrtusteer
- name: "MMN openwrtusteer - Determine target host for delegation"
  ansible.builtin.set_fact:
    _openwrt_usteer_target_host: "{{ openwrt_imagebuilder_buildhost if (openwrt_imagebuilder_buildhost is defined and openwrt_imagebuilder_buildhost != inventory_hostname) else inventory_hostname }}"

- name: Detect imagebuilder
  ansible.builtin.set_fact:
    openwrt_usteer_deployroot: "{{ openwrt_imagebuilder_deployroot }}"
    openwrt_usteer_runimagebuilder: true
  when: openwrt_imagebuilder_deployroot is defined

- name: Make sure deploypath is present
  ansible.builtin.file:
    path: "{{ openwrt_usteer_deploypath }}"
    state: directory
    mode: '0755'
  delegate_to: "{{ _openwrt_usteer_target_host }}"

- name: Setup usteer config
  ansible.builtin.template:
    src: "usteer.jinja2"
    dest: "{{ openwrt_usteer_deploypath }}/{{ openwrt_usteer_deployfile }}"
    mode: '0644'
  notify: Restart usteer
  delegate_to: "{{ _openwrt_usteer_target_host }}"

- name: Install needed packages
  block:
    - name: Set install role vars
      ansible.builtin.set_fact:
        packages_installrole:
          - "usteer"
          - "luci-app-usteer"
    - name: Call packages role
      ansible.builtin.include_role:
        name: imp1sh.ansible_managemynetwork.ansible_packages
  when: not openwrt_usteer_runimagebuilder | default(false)

- name: Initialize packages_installimagebuilder
  ansible.builtin.set_fact:
    packages_installimagebuilder: []
  when:
    - packages_installimagebuilder is not defined
    - openwrt_usteer_runimagebuilder

- name: Merge role packages into packages_installimagebuilder
  ansible.builtin.set_fact:
    packages_installimagebuilder: "{{ packages_installimagebuilder + ['usteer', 'luci-app-usteer'] }}"
  when: openwrt_usteer_runimagebuilder
