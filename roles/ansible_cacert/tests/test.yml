---
- name: Test ansible_cacert role
  hosts: localhost
  remote_user: root
  vars:
    cacert_ca_manager_host: localhost
    cacert_cas:
      test_ca:
        state: present
        common_name: "Test CA"
        country_name: "DE"
        organization_name: "TestOrg"
      test_ca_absent:
        state: absent
        common_name: "Absent CA"
        country_name: "DE"
        organization_name: "TestOrg"
    cacert_clientcerts:
      - common_name: "test-client"
        dest: "/tmp/cacert-test-client"
        state: present
    cacert_additionalcerts:
      - id: "wildcard_test"
        common_name: "*.test.example.com"
        altnames:
          - name: "*.test.example.com"
            prefix: "DNS"
  roles:
    - imp1sh.ansible_managemynetwork.ansible_cacert
