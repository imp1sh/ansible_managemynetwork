---
# ansible_cacert defaults
cacert_tag_privatekey: "privatekey"
cacert_tag_certificate: "certificate"
cacert_tag_clientcert: "clientcert"
cacert_tag_clientkey: "clientkey"
cacert_deployroot: "/"
cacert_runimagebuilder: false
cacert_browser_trust: true

# CA definitions (dictionary keyed by CA identifier)
cacert_cas: {}

# client cert definitions (list)
cacert_clientcerts: []

# additional server certs (list) — extra certs beyond the default cert,
# e.g. wildcards. Each entry: id, state, common_name, altnames, not_after,
# not_before, type, bitsize, curve, passphrase, force, organization_name,
# organizational_unit_name, country_name, state_or_province_name, locality_name,
# email_address, additionalpaths, key_additionalpaths.
# Unset fields inherit from the cacert_defaultcert_* scalars above.
cacert_additionalcerts: []

# default cert (the automatic per-host server cert) controls + inheritance base
# for additional certs (cacert_additionalcerts). Set state to "absent" to skip
# generating and to remove the default cert on a host.
cacert_defaultcert_state: "present"
cacert_defaultcert_common_name: "{{ inventory_hostname }}"
cacert_defaultcert_bitsize: 4096
cacert_defaultcert_type: "RSA"
cacert_defaultcert_not_before: "-1d"
cacert_defaultcert_not_after: "+52w"
cacert_defaultcert_force: false

# client cert defaults
cacert_clientcert_bitsize: 4096
cacert_clientcert_type: "RSA"
cacert_clientcert_not_before: "-1d"
cacert_clientcert_not_after: "+54w"
cacert_clientcert_force: false
