---
- name: "MMN cacert - Default key other host paths must exist"
  delegate_to: "{{ cacert_defaultkey_additionalhost.targethost }}"
  become: True
  ansible.builtin.file:
    state: directory
    path: "{{ cacert_defaultkey_additionalhost.targethostpath }}"
    owner: "{{ cacert_defaultkey_additionalhost.targethostuser | default(omit) }}"
    group: "{{ cacert_defaultkey_additionalhost.targethostgroup | default(omit) }}"

- name: "MMN cacert - Copy default key also to other hosts"
  delegate_to: "{{ cacert_defaultkey_additionalhost.targethost }}"
  become: True
  ansible.builtin.copy:
    content: "{{ cacert_defaultkey_existing.content | b64decode }}"
    dest: "{{ cacert_defaultkey_additionalhost.targethostpath }}/{{ cacert_filename_defaultkey }}"
    mode: "0600"
    owner: "{{ cacert_defaultkey_additionalhost.targethostuser | default(omit) }}"
    group: "{{ cacert_defaultkey_additionalhost.targethostgroup | default(omit) }}"
