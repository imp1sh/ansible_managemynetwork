---
# Deploy a certificate + private key as a Kubernetes TLS Secret.
#
# Caller must set before include:
#   _cacert_k8s_namespace:   target namespace
#   _cacert_k8s_secret_name: secret name
#   _cacert_k8s_cert_path:   path to the cert PEM on the target host
#   _cacert_k8s_key_path:    path to the key PEM on the target host
#   _cacert_k8s_state:       present|absent
#
# Global vars consumed:
#   cacert_k8s_api_url:     Kubernetes API endpoint (host:port)
#   cacert_k8s_api_token:   Bearer token for authentication
#   cacert_k8s_ca_b64:      Base64-encoded CA cert for TLS verification

- name: "MMN cacert - k8s - Validate k8s connection variables"
  ansible.builtin.assert:
    that:
      - cacert_k8s_api_url is defined
      - cacert_k8s_api_url | length > 0
      - cacert_k8s_api_token is defined
      - cacert_k8s_api_token | length > 0
      - cacert_k8s_ca_b64 is defined
      - cacert_k8s_ca_b64 | length > 0
    fail_msg: >-
      k8s_namespace is set but k8s connection vars are missing.
      Need: cacert_k8s_api_url, cacert_k8s_api_token, cacert_k8s_ca_b64.
    success_msg: "k8s connection variables are set"

- name: "MMN cacert - k8s - Decode CA cert to temp file on localhost"
  ansible.builtin.copy:
    dest: "/tmp/cacert_k8s_ca.pem"
    content: "{{ cacert_k8s_ca_b64 | b64decode }}"
    mode: "0600"
  delegate_to: localhost
  run_once: true

- name: "MMN cacert - k8s - Slurp certificate from target host"
  become: "{{ _cacert_become }}"
  ansible.builtin.slurp:
    src: "{{ _cacert_k8s_cert_path }}"
  register: _cacert_k8s_cert_slurp
  delegate_to: "{{ _cacert_target_host }}"
  when: _cacert_k8s_state | default('present') == 'present'

- name: "MMN cacert - k8s - Slurp private key from target host"
  become: "{{ _cacert_become }}"
  ansible.builtin.slurp:
    src: "{{ _cacert_k8s_key_path }}"
  register: _cacert_k8s_key_slurp
  delegate_to: "{{ _cacert_target_host }}"
  when: _cacert_k8s_state | default('present') == 'present'

- name: "MMN cacert - k8s - Deploy TLS Secret"
  kubernetes.core.k8s:
    state: present
    host: "https://{{ cacert_k8s_api_url }}"
    api_key: "{{ cacert_k8s_api_token }}"
    validate_certs: true
    ca_cert: "/tmp/cacert_k8s_ca.pem"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _cacert_k8s_secret_name | regex_replace('_', '-') | lower }}"
        namespace: "{{ _cacert_k8s_namespace }}"
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ _cacert_k8s_cert_slurp.content }}"
        tls.key: "{{ _cacert_k8s_key_slurp.content }}"
  delegate_to: localhost
  when: _cacert_k8s_state | default('present') == 'present'

- name: "MMN cacert - k8s - Delete TLS Secret"
  kubernetes.core.k8s:
    state: absent
    host: "https://{{ cacert_k8s_api_url }}"
    api_key: "{{ cacert_k8s_api_token }}"
    validate_certs: true
    ca_cert: "/tmp/cacert_k8s_ca.pem"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _cacert_k8s_secret_name | regex_replace('_', '-') | lower }}"
        namespace: "{{ _cacert_k8s_namespace }}"
  delegate_to: localhost
  when: _cacert_k8s_state | default('present') == 'absent'
