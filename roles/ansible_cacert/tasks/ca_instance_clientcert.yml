---
# Re-derive filename and path vars for the current cacert_clientcert loop
# iteration. ca_instance_clientkey.yml (called in a preceding separate loop)
# sets these as facts, but facts persist after that loop ends and retain the
# LAST iteration's values. Without resetting them here, every iteration of
# this loop would operate on the wrong client cert's filenames/paths — e.g.
# distributing the last user's .p12 to every other user's additionalhosts.
- name: "MMN cacert - Define filename vars"
  ansible.builtin.set_fact:
    cacert_filename_clientkey: "{{ cacert_clientcert.common_name }}{{ cacert_filename_clientkey_suffix }}"
    cacert_filename_clientcert: "{{ cacert_clientcert.common_name }}{{ cacert_filename_clientcert_suffix }}"
    cacert_filename_clientpkcs12: "{{ cacert_clientcert.common_name }}{{ cacert_filename_clientpkcs12_suffix }}"

- name: "MMN cacert - Define path vars"
  ansible.builtin.set_fact:
    cacert_path_clientkey: "{{ cacert_clientcert.dest }}/{{ cacert_filename_clientkey }}"
    cacert_path_clientcert: "{{ cacert_clientcert.dest }}/{{ cacert_filename_clientcert }}"
    cacert_path_clientpkcs12: "{{ cacert_clientcert.dest }}/{{ cacert_filename_clientpkcs12 }}"

- name: "MMN cacert - Client Cert shall be present block"
  when:
    - cacert_ca.value.state | default('present') == 'present'
  block:
    - name: "MMN cacert - Check if client cert exists"
      become: "{{ _cacert_become }}"
      ansible.builtin.stat:
        path: "{{ cacert_path_clientcert }}"
      register: stat_certificate_client
      delegate_to: "{{ _cacert_target_host }}"

    - name: "MMN cacert - Read existing certificate"
      become: "{{ _cacert_become }}"
      ansible.builtin.slurp:
        src: "{{ cacert_path_clientcert }}"
      register: certificate_client
      when: stat_certificate_client.stat.exists
      delegate_to: "{{ _cacert_target_host }}"

    - name: "MMN cacert - Check if client cert is expired"
      become: "{{ _cacert_become }}"
      ansible.builtin.command:
        cmd: "openssl x509 -in {{ cacert_path_clientcert }} -checkend 0 -noout"
      register: _clientcert_expiry
      changed_when: false
      failed_when: false
      when: stat_certificate_client.stat.exists
      delegate_to: "{{ _cacert_target_host }}"

    - name: "MMN cacert - Manage client CSRs"
      become: "{{ _cacert_become }}"
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ cacert_path_clientkey }}"
        privatekey_passphrase: "{{ cacert_clientcert_passphrase | default(omit) }}"
        common_name: "{{ cacert_clientcert.common_name | default(inventory_hostname) }}"
      register: csr_client
      changed_when: false
      delegate_to: "{{ _cacert_target_host }}"

    - name: "MMN cacert - Normalize client cert validity timespecs (y->w)"
      ansible.builtin.set_fact:
        _cacert_cli_na: >-
          {%- set t = cacert_clientcert.not_after | default(cacert_clientcert_not_after) | default('+54w') -%}
          {%- if t[-1] == 'y' -%}{{ t[0] }}{{ (t[1:-1] | int) * 52 }}w{%- else -%}{{ t }}{%- endif -%}
        _cacert_cli_nb: >-
          {%- set t = cacert_clientcert.not_before | default(cacert_clientcert_not_before) | default('-1d') -%}
          {%- if t[-1] == 'y' -%}{{ t[0] }}{{ (t[1:-1] | int) * 52 }}w{%- else -%}{{ t }}{%- endif -%}

    - name: "MMN cacert - Sign client certificate with our CA"
      become: True
      delegate_to: "{{ cacert_ca_manager_host }}"
      community.crypto.x509_certificate_pipe:
        csr_content: "{{ csr_client.csr }}"
        content: "{{ (certificate_client.content | b64decode) if stat_certificate_client.stat.exists else omit }}"
        force: "{{ (cacert_clientcert.force | default(cacert_clientcert_force) | default(false) | bool) or ((_clientcert_expiry.rc | default(0)) != 0) }}"
        provider: ownca
        ownca_path: "{{ cacert_path_cacert }}"
        ownca_privatekey_path: "{{ cacert_path_cakey }}"
        ownca_privatekey_passphrase: "{{ cacert_ca.value.key.passphrase | default(omit) }}"
        ownca_not_after: "{{ _cacert_cli_na }}"
        ownca_not_before: "{{ _cacert_cli_nb }}"
      register: cacert_clientcert_result

    - name: "MMN cacert - Make sure cert path exists"
      become: "{{ _cacert_become }}"
      ansible.builtin.file:
        state: directory
        path: "{{ cacert_path_clientcert | dirname }}"
      delegate_to: "{{ _cacert_target_host }}"

    - name: "MMN cacert - Write client cert to file"
      become: "{{ _cacert_become }}"
      ansible.builtin.copy:
        content: "{{ cacert_clientcert_result.certificate }}"
        dest: "{{ cacert_path_clientcert }}"
        owner: "{{ cacert_clientcert.user | default(omit) }}"
        group: "{{ cacert_clientcert.group | default(omit) }}"
        backup: True
      when: ( cacert_clientcert_result is changed ) or ( not stat_certificate_client.stat.exists )
      delegate_to: "{{ _cacert_target_host }}"

    - name: "MMN cacert - Stat existing PKCS12 bundle"
      become: "{{ _cacert_become }}"
      ansible.builtin.stat:
        path: "{{ cacert_path_clientpkcs12 }}"
      register: stat_pkcs12_client
      delegate_to: "{{ _cacert_target_host }}"

    - name: "MMN cacert - Generate PKCS12 bundle for browser import"
      become: "{{ _cacert_become }}"
      ansible.builtin.command:
        cmd: >-
          openssl pkcs12 -export
          -out {{ cacert_path_clientpkcs12 }}
          -inkey {{ cacert_path_clientkey }}
          -in {{ cacert_path_clientcert }}
          -name {{ cacert_clientcert.common_name | default(inventory_hostname) }}
          -passout pass:{{ cacert_clientcert.pkcs12_passphrase | default(cacert_clientcert_pkcs12_passphrase) | default('') }}
      when:
        - cacert_clientcert_pkcs12 | default(true) | bool
        - ( cacert_clientcert_result is changed ) or ( not stat_certificate_client.stat.exists ) or ( not stat_pkcs12_client.stat.exists )
      changed_when: true
      delegate_to: "{{ _cacert_target_host }}"

    - name: "MMN cacert - Set PKCS12 permissions"
      become: "{{ _cacert_become }}"
      ansible.builtin.file:
        path: "{{ cacert_path_clientpkcs12 }}"
        owner: "{{ cacert_clientcert.user | default(omit) }}"
        group: "{{ cacert_clientcert.group | default(omit) }}"
        mode: "0600"
      when:
        - cacert_clientcert_pkcs12 | default(true) | bool
        - ( cacert_clientcert_result is changed ) or ( not stat_certificate_client.stat.exists ) or ( not stat_pkcs12_client.stat.exists )
      delegate_to: "{{ _cacert_target_host }}"

- name: "MMN cacert - Remove client cert from path"
  become: "{{ _cacert_become }}"
  ansible.builtin.file:
    path: "{{ cacert_path_clientcert }}"
    state: absent
  when: cacert_clientcert.state | default('present') == 'absent'
  delegate_to: "{{ _cacert_target_host }}"

- name: "MMN cacert - Remove PKCS12 bundle from path"
  become: "{{ _cacert_become }}"
  ansible.builtin.file:
    path: "{{ cacert_path_clientpkcs12 }}"
    state: absent
  when: cacert_clientcert.state | default('present') == 'absent'
  delegate_to: "{{ _cacert_target_host }}"

# Cross-host distribution / removal of the client PKCS12 bundle. The included
# file branches internally on cacert_clientcert.state, so a single top-level
# include covers both present (slurp + copy + NSS import) and absent (delete +
# certutil -D) flows. Only fires when the item defines `additionalhosts`.
- name: "MMN cacert - Manage client PKCS12 on additional hosts"
  ansible.builtin.include_tasks: ca_instance_clientcert_additional_hosts.yml
  when: cacert_clientcert.additionalhosts is defined
