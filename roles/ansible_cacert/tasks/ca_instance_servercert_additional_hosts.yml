---
- name: "MMN cacert - Additional hosts for cert block"
  when:
    - cacert_ca.value.state | default('present') == 'present'
    - cacert_servercert_additionalhosts is defined
  block:
    - name: "MMN cacert - Read existing server certificate"
      become: True
      ansible.builtin.slurp:
        src: "{{ cacert_path_servercert }}"
      register: cacert_servercert_existing

    - name: "MMN cacert - Iterate over additional hosts"
      ansible.builtin.include_tasks: ca_instance_servercert_additional_hosts_instance.yml
      loop: "{{ cacert_servercert_additionalhosts }}"
      loop_control:
        loop_var: "cacert_servercert_additionalhost"
      when: cacert_servercert_additionalhost.state | default('present') == 'present'

- name: "MMN cacert - Remove server cert from additional hosts"
  delegate_to: "{{ cacert_servercert_additionalhost.targethost }}"
  become: True
  ansible.builtin.file:
    path: "{{ cacert_servercert_additionalhost.targethostpath }}/{{ cacert_filename_servercert }}"
    state: absent
  loop: "{{ cacert_servercert_additionalhosts | default([]) }}"
  loop_control:
    loop_var: "cacert_servercert_additionalhost"
  when:
    - cacert_servercert_additionalhosts is defined
    - (cacert_servercert_additionalhost.state | default('present') == 'absent') or (cacert_ca.value.state | default('present') == 'absent')
