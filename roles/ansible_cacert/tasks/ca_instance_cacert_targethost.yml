---
- name: "MMN cacert - Make sure CA cert is installed to target host"
  become: "{{ _cacert_become }}"
  ansible.builtin.copy:
    content: "{{ cacert_ca_cert.certificate }}"
    dest: "{{ cacert_path_cacert_targethost }}"
    backup: True
  when:
    - cacert_ca.value.state | default('present') == 'present'
    - ansible_distribution != 'OpenWrt'
    - not cacert_runimagebuilder | default(false) | bool
  notify: "MMN cacert - Update trust store"

- name: "MMN cacert - Remove legacy .pem CA cert artifact from target host"
  become: "{{ _cacert_become }}"
  ansible.builtin.file:
    path: "{{ cacert_openssl_path_certificate_ca }}/{{ cacert_ca.key }}_ca_{{ cacert_tag_certificate }}.pem"
    state: absent
  when:
    - cacert_ca.value.state | default('present') == 'present'
    - cacert_openssl_suffix_certificate_ca != 'pem'
    - ansible_distribution != 'OpenWrt'
    - not cacert_runimagebuilder | default(false) | bool
  notify: "MMN cacert - Update trust store"

- name: "MMN cacert - Merge CA cert into OpenWrt trust bundle"
  become: "{{ _cacert_become }}"
  ansible.builtin.blockinfile:
    path: "{{ cacert_openssl_path_certificate_ca }}/ca-certificates.crt"
    create: true
    marker: "# {mark} ANSIBLE_MANAGEMYNETWORK_ANSIBLE_CACERT {{ cacert_filename_cacert }}"
    block: "{{ cacert_ca_cert.certificate }}"
  when:
    - ansible_distribution == 'OpenWrt'
    - not cacert_runimagebuilder | default(false) | bool
    - cacert_ca.value.state | default('present') == 'present'

- name: "MMN cacert - Remove CA cert from target host"
  become: "{{ _cacert_become }}"
  ansible.builtin.file:
    path: "{{ cacert_path_cacert_targethost }}"
    state: absent
  when:
    - cacert_ca.value.state | default('present') == 'absent'
    - ansible_distribution != 'OpenWrt'
    - not cacert_runimagebuilder | default(false) | bool
  notify: "MMN cacert - Update trust store"

- name: "MMN cacert - Remove CA cert from OpenWrt trust bundle"
  become: "{{ _cacert_become }}"
  ansible.builtin.blockinfile:
    path: "{{ cacert_openssl_path_certificate_ca }}/ca-certificates.crt"
    state: absent
    marker: "# {mark} ANSIBLE_MANAGEMYNETWORK_ANSIBLE_CACERT {{ cacert_filename_cacert }}"
  when:
    - ansible_distribution == 'OpenWrt'
    - not cacert_runimagebuilder | default(false) | bool
    - cacert_ca.value.state | default('present') == 'absent'

# ADDITIONAL PATH
- name: "MMN cacert - Additional paths block"
  when:
    - cacert_cacert_additionalpaths is defined
    - cacert_ca.value.state | default('present') == 'present'
    - not cacert_runimagebuilder | default(false) | bool
  block:
    - name: "MMN cacert - Make sure additional paths exist"
      become: "{{ _cacert_become }}"
      ansible.builtin.file:
        state: directory
        path: "{{ additionalpaths.dest }}"
      loop: "{{ cacert_cacert_additionalpaths }}"
      loop_control:
        loop_var: "additionalpaths"
      when: additionalpaths.state | default('present') == 'present'

    - name: "MMN cacert - Write ca cert to additional paths"
      become: "{{ _cacert_become }}"
      ansible.builtin.copy:
        content: "{{ cacert_ca_cert.certificate }}"
        dest: "{{ additionalpaths.dest }}/{{ cacert_filename_cacert }}"
        remote_src: True
        owner: "{{ additionalpaths.user | default(omit) }}"
        group: "{{ additionalpaths.group | default(omit) }}"
      loop: "{{ cacert_cacert_additionalpaths }}"
      loop_control:
        loop_var: "additionalpaths"
      when: additionalpaths.state | default('present') == 'present'

- name: "MMN cacert - Remove ca cert from additional paths"
  become: "{{ _cacert_become }}"
  ansible.builtin.file:
    path: "{{ additionalpaths.dest }}/{{ cacert_filename_cacert }}"
    state: absent
  loop: "{{ cacert_cacert_additionalpaths }}"
  loop_control:
    loop_var: "additionalpaths"
  when:
    - cacert_cacert_additionalpaths is defined
    - (additionalpaths.state | default('present') == 'absent') or (cacert_ca.value.state | default('present') == 'absent')
    - not cacert_runimagebuilder | default(false) | bool
