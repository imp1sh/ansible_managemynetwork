---
# VALIDATE REQUIRED VARIABLES
- name: "MMN cacert - Validate required variables"
  ansible.builtin.assert:
    that:
      - cacert_ca_manager_host is defined
      - cacert_ca_manager_host | length > 0
      - cacert_cas is defined
      - cacert_cas | length > 0
    fail_msg: "cacert_ca_manager_host and cacert_cas must be defined and non-empty"
    success_msg: "Required variables are valid"

# LOAD OS VARS
- name: "MMN cacert - Load OS vars"
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
        - "default.yml"
      paths:
        - "vars"

# PACKAGES - TARGET HOSTS
- name: "MMN cacert - Install required packages on target hosts"
  become: true
  when: not cacert_runimagebuilder | default(false) | bool
  block:
    - name: "MMN cacert - Set packages to install"
      ansible.builtin.set_fact:
        packages_installrole: "{{ cacert_packages }}"

    - name: "MMN cacert - Run package role"
      ansible.builtin.include_role:
        name: imp1sh.ansible_managemynetwork.ansible_packages

# NOTE: python3-cryptography must be pre-installed on the CA manager host
# (see README requirements). We deliberately do NOT auto-install it there:
# delegation preserves the target host's ansible_distribution, which would
# make the ansible_packages role pick the wrong package manager for the CA host.
# CERTS
- name: "MMN cacert - Manage CA key and cert"
  ansible.builtin.include_tasks: ca_instance.yml
  loop: "{{ cacert_cas | dict2items }}"
  loop_control:
    loop_var: "cacert_ca"
