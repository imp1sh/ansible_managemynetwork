---
- name: "MMN opensearch - Ensure dashboards config directory exists"
  ansible.builtin.file:
    path: "{{ opensearch_path_dashboards_config }}"
    state: directory
    owner: "{{ opensearch_owner }}"
    group: "{{ opensearch_group }}"
    mode: "0750"

- name: "MMN opensearch - Render opensearch_dashboards.yml"
  ansible.builtin.template:
    src: opensearch_dashboards.yml.j2
    dest: "{{ opensearch_path_dashboards_config }}/{{ opensearch_dashboards_file_config }}"
    owner: "{{ opensearch_owner }}"
    group: "{{ opensearch_group }}"
    mode: "{{ opensearch_mode_config }}"
  notify: Restart opensearch dashboards container

- name: "MMN opensearch - Debug rendered opensearch_dashboards.yml"
  ansible.builtin.debug:
    var: opensearch_dashboards_yml
  when: mmn_verbose | default(false) | bool
