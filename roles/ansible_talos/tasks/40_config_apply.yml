---
# HOST-SPECIFIC PATCHING ONLY
# Cluster-wide patches are applied during `talosctl gen config` via --config-patch flags.

# CONTROLPLANE NODES
- name: MMN Talos - Generate controlplane host patches
  ansible.builtin.template:
    src: controlplane_patch_hostspecific.yaml.j2
    dest: "{{ talos_patches_path }}/controlplane_{{ clusternode.name }}_patch.yaml"
  loop: "{{ talos_cluster_hosts_cp }}"
  loop_control:
    loop_var: clusternode
- name: MMN Talos - Apply controlplane host patchfiles
  ansible.builtin.command:
    cmd: "talosctl machineconfig patch {{ talos_config_path }}/controlplane.yaml -p @{{ talos_patches_path }}/controlplane_{{ clusternode.name }}_patch.yaml -o {{ talos_config_path }}/controlplane_{{ clusternode.name }}.yaml"
  loop: "{{ talos_cluster_hosts_cp }}"
  loop_control:
    loop_var: clusternode
- name: MMN Talos - Deploy controlplane hosts
  ansible.builtin.command:
    cmd: "talosctl apply-config --insecure --nodes {{ clusternode.ip4[0] | ansible.utils.ipaddr('address') }} --endpoints {{ clusternode.ip4[0] | ansible.utils.ipaddr('address') }} --file {{ talos_config_path }}/controlplane_{{ clusternode.name }}.yaml"
  loop: "{{ talos_cluster_hosts_cp }}"
  loop_control:
    loop_var: clusternode

# WORKER NODES
- name: MMN Talos - Generate worker node patches
  ansible.builtin.template:
    src: worker_patch_hostspecific.yaml.j2
    dest: "{{ talos_patches_path }}/worker_{{ clusternode.name }}_patch.yaml"
  loop: "{{ talos_cluster_hosts_worker | default([]) }}"
  loop_control:
    loop_var: clusternode
- name: MMN Talos - Apply worker node patchfiles
  ansible.builtin.command:
    cmd: "talosctl machineconfig patch {{ talos_config_path }}/worker.yaml -p @{{ talos_patches_path }}/worker_{{ clusternode.name }}_patch.yaml -o {{ talos_config_path }}/worker_{{ clusternode.name }}.yaml"
  loop: "{{ talos_cluster_hosts_worker | default([]) }}"
  loop_control:
    loop_var: clusternode
- name: MMN Talos - Deploy worker nodes
  ansible.builtin.command:
    cmd: "talosctl apply-config --insecure --nodes {{ clusternode.ip4[0] | ansible.utils.ipaddr('address') }} --endpoints {{ clusternode.ip4[0] | ansible.utils.ipaddr('address') }} --file {{ talos_config_path }}/worker_{{ clusternode.name }}.yaml"
  loop: "{{ talos_cluster_hosts_worker | default([]) }}"
  loop_control:
    loop_var: clusternode
