---
# defaults file for ansible_talos
talos_version: "v1.9.2"
talos_talosctl_version: "{{ talos_version }}"
talos_secrets_file: "secrets.yaml"
# this is the file name where the patches for the controlplanes go into, not to confuse with talos_filename_controlplane_patch
talos_filename_controlplane_patched: "controlplane_patched.yaml"
cilium_chart_version: "1.20.2"
# Enable Cilium Gateway API controller. Also installs Gateway API CRDs.
# Set per cluster via talos_clusters.<name>.cilium_gateway_api.
cilium_gateway_api: false
# Gateway API CRD version to install when cilium_gateway_api is enabled.
cilium_gateway_api_crd_version: "v1.2.1"
# Default schematic ID from factory.talos.dev (vanilla metal-installer, no extensions).
# Override per cluster via talos_clusters.<name>.schematic_id.
talos_schematic_id: "376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba"
